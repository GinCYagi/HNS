document:
  name: "査読辞書"
  hns_version: "0.1"
  exported_at: "2026-07-12"
  updated_at: "2026-10-02"
  note: "棄却理由の必記録(P-03)・監査証跡運用(P-04)に基づく。原文引用は冠記付き形式で行うこと"

# -------------------------------------------------------------
# Gin裁定記録
# -------------------------------------------------------------
rulings:
  - id: RUL-001
    date: null
    subject: "現代実在地名の転用"
    ruling: "原則廃止とせず『使用可・厳格査読』へ。4条件(実在路線衝突/実在駅衝突/方面矛盾/音声誤認)を査読対象とする"
    reason: "本プロジェクトは完全な架空地理ではなく『現実の日本を少しだけずらした世界』を目指すため"
  - id: RUL-002
    date: null
    subject: "蝦夷の扱い"
    ruling: "歴史的含意を認識した上で候補維持→のち北加伊(きたがい)へ更新。公開前最終査読を実施"
  - id: RUL-003
    date: null
    subject: "見出し語の変更"
    ruling: "『被差別漢字』は不使用。『差別的・侮蔑的含意を持ち得る漢字』へ変更(分類対象の固定化回避)"
  - id: RUL-004
    date: null
    subject: "R-03/R-04の再定義"
    ruling: "R-03=格反転禁止(C-06へ)、R-04=地形カテゴリ内置換(G-05へ)"
  - id: RUL-005
    date: null
    subject: "HNS Ver.0.1凍結"
    ruling: "新規規則追加を停止し検証優先。実運用の課題のみVer.0.2差分として管理"
  - id: RUL-006
    date: "2026-07-07"
    subject: "西海道の去就(最優先裁定)"
    ruling: "B案採択:火守道(ひもりのみち)を正式採用。既採用資産は世界設定変更として連鎖修正。Ver.0.2差分の最初の変更記録"
  - id: RUL-007
    date: null
    subject: "火守道の歴史設定"
    ruling: "(b)案:当初西海道→火山災害・鎮火信仰の定着を経て火守道へ改称。改称時期は未確定事項へ"
  - id: RUL-008
    date: null
    subject: "G-07の位置付け"
    ruling: "上位規則の置換ではなく、十分な文化史・歴史・信仰・地誌上の根拠をGinが裁定した場合のみ選択可能。管線上Gin裁定必須通過。火守道が判例第一号"
  - id: RUL-009
    date: null
    subject: "D-03短縮派生の運用"
    ruling: "一律判定せず短縮後の形を新規候補としてC-01〜04(必要に応じC-08)へ再投入"
  - id: RUL-010
    date: null
    subject: "G-02の維持"
    ruling: "陸奥・二名島は維持。G-07への全面移行構想なし"

  - id: RUL-011
    date: "2026-09-30"
    subject: "都道府県の単位"
    ruling: "現実の47都道府県を、境界はそのままで改名する"
    note: "引継ぎ書2026-09-30 §2-1の要約。Ginの原文は未収録(確認中)"
  - id: RUL-012
    date: "2026-09-30"
    subject: "区分名の変換"
    ruling: "五畿七道の区分名も変換する"
    note: "引継ぎ書2026-09-30 §2-2の要約。Ginの原文は未収録(確認中)"
  - id: RUL-013
    date: "2026-09-30"
    subject: "基本運用"
    ruling: "Gin「いえ、そうした基本的な運用規則はすべて実態に即します。」(りゅうと漁港の組み方)"
  - id: RUL-014
    date: "2026-10-01"
    subject: "子から親の特例"
    ruling: "Gin「柳都県、子から親の特例（Gin裁定」"
  - id: RUL-015
    date: "2026-10-01"
    subject: "路線名の「都」"
    ruling: "路線名の「都」は東都を指す。柳都は「柳」と略す(Gin「都洋線衝突回避（都都問題」「柳都（ex：長野）都都問題により除外」)"
  - id: RUL-016
    date: "2026-10-01"
    subject: "同字・同意の重複"
    ruling: "Gin「東都-柳都間を結ぶ、富津と会津のように重複（意味）は許容。津＝水辺の居のため全国に多数あり」"
  - id: RUL-017
    date: "2026-10-01"
    subject: "実名のまま"
    ruling: "Gin「実名のママは全却下です」「いまのところは」(暫定)"
    exceptions: ["~~よろずよ橋(萬代橋の当初の訓読み。G-01。Ginに例外の確認中)~~ → 解消:いまの表記はよろずよ橋で、実在の萬代橋(ばんだいばし)の字のままではない(Gin「げんざいのひょうきは　よろずよ橋」2026-10-02)。例外は要らない。城も例外ではない(Gin「実在名を許容ではないです」2026-10-02)"]
  - id: RUL-018
    date: "2026-10-01"
    subject: "動物の字を含む地名"
    ruling: "Gin「人にひとの名前がつくのなら、ひとにもひとのなまえが 付くんじゃないかな」→ 残す"
  - id: RUL-019
    date: "2026-10-02"
    subject: "柳都県りゅうと市の中の名前"
    ruling: "Ginの裁量で決め、HNSの裁定を待たない(Gin「柳都県りゅうと市はGin最良とします」=裁量。ALM経由)。HNSは記録と照合のみ。県より外はHNSの管線どおり"
  - id: RUL-020
    date: "2026-10-02"
    subject: "HNSの役目"
    ruling: "Gin「いつかカッコをなくせるのが目標なんです」「わからないときは（）で聞く　ひとも人もね」「それを任せてるのが HNS なんです」"
  - id: RUL-021
    date: "2026-10-02"
    subject: "一般語を付けた派生名(通り・口など)"
    ruling: "Gin「とおり、口は一般ルールとして記載、基本容認」。親の名前に「通り」「口」などの一般語を付けた派生名は、親の現在の表記に合わせ、個別の裁定を待たずに基本容認する(例:よろずよ橋→よろずよ通り・よろずよ口)"
  - id: RUL-022
    date: "2026-10-03"
    subject: "りゅうと(市)の命名規則"
    ruling: "Gin「りゅうとの命名規則は埼玉県さいたま市の応用、と記録して」(2026-10-03、HNS-NGのセッション)。NGの読み「県は漢字(柳都県)、市はひらがな(りゅうと市)で同じ音、という組み方の根拠は現実の埼玉県さいたま市」にGin「あっています」(同)。先の yomi_ruling Gin「柳都県　埼玉県さいたま市を参考」(2026-10-02)を規則として記録"
    applies_to: ["柳都県", "りゅうと市"]
  - id: RUL-023
    date: "2026-10-03"
    subject: "旧国名を含む今の地名の替え方(DIFF-022を採用)"
    ruling: "Gin「採用」(2026-10-03、HNS-Orcの問い「DIFF-022を正式な決まりとして採りますか」への答え)。試す順:①現実の別の呼び方に旧国名がなく、別の土地の今の名とも同じでなければ、それを正式な名前に上げ、残る実在の地名は日ノ本名に(越後平野→新潟平野の形→柳都平野)②旧国名の部分を親(県・道)の日ノ本名の一字に替え、後ろの地名も日ノ本名に③まるごと新しい名前に(佐渡市→朱島市)。旧国名が名前の芯にあるもの(信濃川など)は典拠から。旧国名＝今の市町の名は③に直行。長い正式名には通称を一つ"
  - id: RUL-024
    date: "2026-10-03"
    subject: "元号と歴史の出来事は現実にそろえる"
    ruling: "Gin「元号変更は時の流れを感じづらくなるから「つながる絆の物語」にはちと影響が大きすぎるのでここだけはすり合わせましょう、後出来事とかね」(2026-10-03)。日ノ本の元号(明治・大正・昭和・平成・令和)と、歴史の出来事(戊辰戦争・震災・戦争など)の年は現実と同じにする。地名の中の元号は地名の問題として別に扱う(DIFF-023)"
  - id: RUL-025
    date: "2026-10-04"
    subject: "実在の地名を含む出来事の名前は、名前を出さずに言い表す"
    ruling: "HNS-Orcの問い(1:日ノ本の名前に替える/2:名前を出さずに言い表す/3:現実のまま残す、例は水俣病・四日市ぜんそく・第二水俣病)にGin「２だね」(2026-10-04)。作品の中では、出来事の名前(新潟水俣病・四日市ぜんそく・白河口の戦い・新潟地震など)を口にせず、何が起きたかで言い表す(例:「閼伽野川の水銀の病」「工場の煙で町の人がぜんそくになった公害」)。日ノ本名のある川・土地はその名を使ってよい。年と中身はRUL-024のとおり現実と同じ。正本のorigin_memo・notesの現実側の記録はこのルールの外。種類ごとの分け方(戦の名前だけ別など)はGinは選ばなかった。合わない場面が出たら、そのときGinに聞く"
# -------------------------------------------------------------
# 判例(precedents)
# -------------------------------------------------------------
precedents:
  - id: PRE-001
    name: "駄賀屋却下"
    principle: "負性漢字(駄・愚・呆等)の含意査読を音韻置換の必須工程とする"
  - id: PRE-002
    name: "白銀線却下"
    principle: "漢字が違っても読みが同一・近似なら不可。判定基準は字面でなく音"
  - id: PRE-003
    name: "小波却下"
    principle: "一般名詞との完全同音(C-04)と格降格(C-06)の複合。反転は格を含意しない軸に限る"
  - id: PRE-004
    name: "京浜系停滞"
    principle: "路線名を都市名より先に作ると矛盾が増える→D系停止条件(親待ち)の設計根拠"
  - id: PRE-005
    name: "蓬左採用"
    principle: "古称・雅称(G-01)は音韻置換より優先。古称が引ける入力に音韻案を混ぜない"
  - id: PRE-006
    name: "北加伊採用"
    principle: "歴史的含意への回答として由来の筋が良い場合も、読み替え比較と判断記録を条件化する"
  - id: PRE-007
    name: "火守道(G-07判例第一号)"
    principle: "十分な文化史・災害史的根拠+由来メモの免責記述(着想と断定の区別)がG-07発動の要件水準"
  - id: PRE-008
    name: "HR火守=可/HR神府=不可"
    principle: "同じ短縮操作でも候補ごとに可否が分かれる。D-03は短縮後の形へのC系再実行で判定(規則で一律に決めない)"
  - id: PRE-009
    name: "神府道のフル形流通(いまは神在道に引き継ぎ)"
    principle: "査読制約が世界設定(正式名称で呼ぶ文化)を生成し得る(P-05)"
  - id: PRE-010
    name: "国府(こうぶ)不可"
    principle: "兄弟エントリ間の読み完全一致(C-08)は実在名衝突より深刻。新規候補の読みは採用済み読みと必ず照合(機械化推奨)"
  - id: PRE-011
    name: "広貴/貴川の『貴』重複"
    principle: "同一諺由来の同字を兄弟階層で多用すると希少性喪失・相互混同(同字過負荷制約の起票根拠)"
  - id: PRE-012
    name: "山陰道/山陽道"
    principle: "対名称は片側だけの確定不可。対エントリ参照列の起票根拠"
  - id: PRE-013
    name: "国府内の親エントリ欄"
    principle: "親欄は架空世界内の依存専用。現実区分との対応は実名欄が担う"
  - id: PRE-014
    name: "逆派生エンティティ(縦山・鍬親・国府内)"
    principle: "路線名・変更影響欄の中で発生した未登録エンティティは、正式登録・査読を先に通す"

