  - {name: "大波(おおなみ)", target: "大阪", checks: [C-04], reason: "大波警報等の一般名詞と音衝突(保留から実質棄却)"}
  - {name: "小波(このは)", target: "大阪", checks: [C-04, C-06], reason: "木の葉と完全同音・格降格"}
  - {name: "小貴(おぎ)", target: "大和", checks: [C-06], reason: "最高格の国への『小』"}
  - {name: "白銀線", target: "山手線", checks: [C-03], reason: "白銀駅(八戸線)・白金"}
  - {name: "男鹿新幹線", target: "秋田新幹線", checks: [C-01], reason: "男鹿線実在"}
  - {name: "陸羽新幹線", target: "秋田新幹線", checks: [C-01, C-08], reason: "陸羽東線・西線実在。陸奥との意味重複"}
  - {name: "虎ノ門線", target: "丸ノ内線", checks: [C-01], reason: "虎ノ門駅実在"}
  - {name: "茅ヶ崎線", target: "横須賀線", checks: ["転用4条件③④"], reason: "方面矛盾・音声誤認(東海道線の駅)"}
  - {name: "京浜新幹線/京浜線/HR京浜", target: "東海道系", checks: [C-08], reason: "意味捻れ・内部矛盾・京急音衝突"}
  - {name: "都波(となみ/とば)", target: "東海道系", checks: [C-03], reason: "砺波・鳥羽と音衝突"}
