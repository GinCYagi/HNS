  - {name: "日ノ中(ひのなか)", target: "東海道系通称", checks: [C-04], reason: "火の中と完全同音"}
  - {name: "海浜陸奥線", target: "京浜東北線", checks: [C-08], reason: "京浜方針廃止に伴う更新"}
  - {name: "西海道", target: "九州", checks: ["Gin裁定"], reason: "B案裁定により棄却(2026-07-07、変更影響ランク初適用)。世界設定変更として整理、旧称として歴史設定に残存"}
  - {name: "くになか(読み)", target: "国府内", checks: [C-03], reason: "山梨『国中』実在地方名"}
  - {name: "こうぶ(読み)", target: "国府内", checks: [C-08, C-03], reason: "神府と完全同音・甲武と完全同音"}
  - {name: "蝦夷", target: "北海道", checks: [C-05第2層系], reason: "歴史的含意の検討を経て北加伊へ更新(検討済み記録)"}

# -------------------------------------------------------------
# 個別査読記録(条件付き・要修正の詳細はマスターYAML参照)
# -------------------------------------------------------------
cross_reference: "エントリ別の条件・修正理由は hns_admin_division_master.yaml の各エントリに収載"
