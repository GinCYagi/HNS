    status: "起票(2026-10-02、Gin「２，OK」：HNS-Revの問い「鶴を青鷺に、燕を雀にしたように、対になる鳥に替えるのはかまわない、とまとめてもいいですか」への答え)。RULとして採番するかはGin"
