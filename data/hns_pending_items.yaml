    status: "採用→RUL-023(Gin「採用」2026-10-03)。起票(2026-10-03、Gin「今回は俗称が正規名称になったパターンになるのか」「これルール化すればある程度まではコストを削減できるよね」)。例:武蔵野市・相模原市・近江八幡市・伊豆市・甲斐市・越後湯沢駅・信濃大町駅ほか(docs/proposals/2026-10-03_kyukokumei_check.md §7)"
  - id: DIFF-023
    item: "元号の名を取った地名(明治町・大正区・昭和村・平成町など)は、まるごと新しい名前にする(RUL-023の③と同じ扱い)。名前は、その土地の持つ魅力(地形・産物・景色)にもとづく。元号に見えて別の由来の古い地名(岐阜県関市の平成〈へなり〉など)は、ふつうの地名として扱う(NG)"
    revised: "改め(2026-10-07):元号の町名は許容(そのまま)。全国に同じ名前がたくさんある地名という感情は残す。許容しかない場合は許容、代わりの名がありそうなら検討。Gin「３，許容しかない場合は許容。代替できそうなら入植時期意外だったらどんな名前がつくか検討…とも思ったけど、全国にいっぱい同じ名前が在る地名という感情は捨てるのはもったいないと主たり」(2026-10-06)、HNS-Orcの問い「DIFF-023を改めて元号の町名は許容にしてよいか」にGin「ちゅうおうく、げんごう、しょうにん」(2026-10-07)。DIFF-035の追記と同じ。追記(2026-10-09):元号の名は、町名だけでなく市町村の段でも許容(昭和村はそのまま)。替えると元禄・慶長など、元号の入った名を全部替えるのかという話になる(Gin「そしたら元禄とか慶長とか全部変えないのかという話になるのよね」)。元号は歴史の層(RUL-024)として、どの段でも残す。元号は理の側(Gin「理だよなぁ、市区町村だけど」「いや元号の方」2026-10-09)"
    status: "起票(2026-10-03、Gin「一応今から懸念点だけ」「年号＋町」「元号」「明治町　大正市　昭和村　平成町」「その時期に入植してるから、位の意味合いしかないと想うので」「その土地の持つ魅力に基づいたなまえとかにできればいいね」)"
  - id: DIFF-024
    item: "県の読みは4音(拍)まで。現実の43県の読みはすべて4音以内(あおもり・かごしまなど。ほっかいどう〈道〉・とうきょう〈都〉は県ではない)なので、5音の県は日ノ本の地図で浮いて見える。数え方は拍(小さいゃゅょは前の音と一つ、っ・ん・のばす音は一つ)。「県」の部分は数えない。市町村には当てない"
    status: "起票(2026-10-04、Gin「５文字読みのけんってどこか在る？」→HNS-Orc「現実の県には5文字の読みはない。県の読みは4文字まで、を決まりの候補として残しますか」→Gin「そういうこと」「どうしても違和感があるのよ」「市だったらいくらでもあるんだけど」)。当たる案:荊柵県(いばらさく)・礫河県(さざれかわ)・繁葛県(しげかずら)。正本に入っている県名はすべて4音以内(HNS-Orc照合)"
  - id: DIFF-025
    item: "言いやすさ(口の動き)も物差しにして候補を探す。例:かつかず(葛葛県)は破裂音・舌先を当てる音が続いて言いやすく、つ→ず の順は舌の触れる面積の関係で ず→つ より楽。Ginは名前を返すときにこれを意識している。候補出し(E5)は読みを声に出したときの口の動きも見て、査読(NG)は言いにくさ(舌がもつれる並び)を記録する"
    status: "知見(2026-10-04、Gin「破裂音の連続が楽だから」「ずよりもつが先に来たほうが振れる面積の関係で楽になる」「この辺も意識して探してみて、ワシが還すときはそうしているから」)。追記(2026-10-05):よく知られた名前と口の動き・イントネーションが同じだと、言いやすく、読み方も迷わない(都林〈とばやし〉と小林〈こばやし〉。Gin「これだと口腔疲労が小林と変わらない」「イントネーションも流用できる」)。決まり(RUL)にするかは未定。追記(2026-10-07):母音の落ち。いななみ は口が休もうとして a を落とし いんなみ になる、頭が いななく・わななく とそろうと引っかかる、ななみ・はななみ は普通(Gin「口が勝手に休もうとするからaが省略されるんだろうね」ほか、手引き §3.2)"
  - id: DIFF-026
    item: "替えない字:町(〇〇町の町)・方角(東西南北。古い方角〈辰巳・巽・乾・艮・坤・戌亥・丑寅 など、十二支・八卦の方角〉も方角の意味のときは同じ)・位置(上中下・前後・左右)・数の字(四・六・七・八・九・百。下の大字を見よ)・数と組んだ度量衡の単位(九十九里・九万坪・千間台・五百石・六斗 の 里・坪・間・石・斗 など、数＋単位 で量の意味のときだけ。数も単位も現実の字のまま残す〈九十九里町・九万坪・千間台・五百石〉。住所の物差しの 数＋条・数＋丁目〈一条・一丁目〉も同じ(2026-10-25、UA-014)。同じ字で単位でない名〈坪＝区切った土地、里＝さと 等〉は名ごとに見る)・暦の名(元号・干支の年〈甲子・庚午 など〉・月の名〈弥生 など〉)・地球を測る線の名(赤道〈せきどう〉・子午線。子午 は方角)は、地名の中でもそのまま残す。これらは重力や気候と同じ「理」の側の言葉で、替えると方角などの説明まで要るようになる。郵便番号の町域(約8万の名前、約4分の1が〇〇町)に当てる。数の字のうち、冠婚葬祭・法令・お札で見慣れた大字のあるものは大字に替える(一→壱・二→弐・三→参・五→伍・十→拾・千→阡・万→萬。読みはそのまま、ルビをつける)。一方通行(現実の 壱・萬 など〈壱岐 ほか〉の行き先は決めていない)。四・六・七・八・九・百 は大字(肆・陸・漆・捌・玖・佰)が読まれにくいので替えない(試して外した道)。十日町市＝什旭町市(十→什、什 は 十 の大字の別の形)はこの道の先例、六日町＝陸野町(六→陸)は名ごとの裁定として残す。これから作る名に当て、決めた名は動かさない(DIFF-050)"
    status: "Gin裁定(2026-10-05、HNS-Orcの問い「町・東西南北・上中下・数字の字は、替えない字にしますか」にGin「1 そのままにしましょう。その辺は重力や気候などの理の域に属します」「変えれば方角に関する話まで説明する必要が出てしまう」)。材料 docs/proposals/2026-10-05_postal_survey.md。RULとして採番するかはGin。前・後 を足した:越後＝渡後 の 後(都から遠い側)を残すため。M4「位置の字の決まり(DIFF-026)に『前・後』を足す」にGin「2,ok」(2026-10-23、HNS-M4 のセッション。docs/proposals/2026-10-23_nagano_city.md)。2026-10-24 の足し:暦の名 Gin「1ok」・古い方角 Gin「2,ok」(HNS-G5 のセッション、docs/proposals/2026-10-24_kotowari_placenames.md §8 87330d2)。左右:Gin「右左は変わらないので」(HNS-G5 のセッション、sync_M4_questions #3)→HNS-M4 の問い「左右 は替えない(DIFF-026 に足す)」にGin「3,ok」(2026-10-24、HNS-M4 のセッション)。赤道(せきどう)・子午線:HNS-M4 の問いにGin「4,変えないでok,赤道直下の国ではないのに地名に赤道が入るかわからないけど方位と同じなら変えられないという認識」(2026-10-24、HNS-M4 のセッション)。地名の 赤道(あかみち、大字 赤道 など)は道の名で別(紅路〈べにじ〉は Gin の案、決めていない)。回帰線 の 回帰 は保留(UA-011)。度量衡の単位:HNS-M4 の問い「1 度量衡の単位 ア(数と組んで単位の意味で使う名だけ替えない字に)」にGin「1,ok 2,ok 3,ok 4,ok」(2026-10-24、HNS-M4 のセッション。docs/proposals/2026-10-24_units.md、HNS-G5・HNS-C5 の推し)。数の字の大字:Gin「数字は大字にすることは出来る？」→HNS-M4 の答え(ア 替えない／イ すべて大字／ウ 法令の四字だけ)→Gin「実際に冠婚葬祭で使う書き方だからルビつきで用いれば弊害も少ないとふんでるんだけど」→HNS-M4(四・六・七・八・九・百 の大字はあまり見ない)→Gin「あんまり難読漢字を乱用して「重複してない！」と言い張るのも(ルビ無しで読めないこと増えてきてるから)控えたくはあるものの、悩ましいね」→HNS-M4 の案 1(見慣れた大字だけ)・案 2(読みにくい字は一つの名に一つまで)・案 3(替えない)→Gin「ではお勧めで」(案 1 と 案 2 を一緒に、と HNS-M4 が読み、最終確認の表に書いた)→Gin「はい」(2026-10-24、HNS-M4 のセッション)。庚申 は信仰の名で別。方角の意味でない 乾・巽 など(乾徳 など)は名ごとに見る"
  - id: DIFF-027
    item: "全国によくある町域の名前(本町314・栄町233・新町171・幸町157・緑町149ほか、郵便番号データ)は、そのまま残す。住所は上の都道府県・市区町村の名前ですでに日ノ本の名前に替わって見分けがつくので、町域まで替えなくても住所は一つに決まる"
    status: "Gin裁定(2026-10-05、HNS-Orcの問い「本町・栄町のようなよくある名前は、全国で同じ替え方にしますか。それとも、そのままにしますか」にGin「2 そこまでの都道府県、市区町村で差別化してるから一意になるはずだからね」)。HNS-Orcの読み取り:「そのまま」と受け取った→Gin「同じで良いと思います」(2026-10-05)。どこからを「よくある名前」とするか(件数の線)は未定"
  - id: DIFF-028
    item: "理の言葉(空・地・海・日・月・星・朝・昼・晩・夕・夜・潮・熱・塩など。朝・昼・晩・夕・夜 は一日の巡りの言葉で理、人が決めた暦の名〈DIFF-026〉とは分ける。替える字の当てがほとんどないので、時の言葉は残して組む字を替える形〈朝暉・夕暉〉になることが多い、どの土地にも共通する自然のもの)も、同じ意味の言葉に替えられるなら替える(例:海→洋、塩→潮・磯→汐〈2026-10-24 に 塩→汐 から書き直し、字の表の 塩⇄潮〉、日→陽・旭〈Gin「日だって陽、旭、あるし」、什旭町市の旭も同じ〉)。同じ意味に替える言葉が見つからないときは、読みを残して字だけ替える(朝日→朝暉〈あさひ〉、Gin「せめてもの抵抗で漢字を変える」)。DIFF-026の替えない字(文は DIFF-026 を見よ)は、替えると方角などの説明が要るので、この決まりの外でそのまま"
    status: "Gin裁定(2026-10-05。中継局の朝日・塩沢、熱塩加納村・熱海・磐梯熱海・新地町を例に、HNS-Orcの問い「理の線をどこに引くか」へ、Gin「変えられる言葉があるなら変えよう」「同じ意味になるなら理を変えることも事実上の許容範囲とする」)。前の経緯:Gin「朝も日も理だからしかたないか」「夜から始まらんし」「だからせめてもの抵抗で漢字を変えるってこと」「潮の満ち引きは理だし、生命に欠かせない塩も理だよね」「海も理か」。記録:正本では海を替えずに残している名前がある(日ノ本海・海北道・海渡道)。これらを替えるかは別の件(今は決まったまま)。追記(2026-10-07):山の字の扱い。**山そのもの(山体)を地理的に呼ぶ名の「山」は理の字として残す**(腰染山・磐梯山の類)。**それ以外の地名の中の山(山田・秋山・郡山・金山町・町名の〜山など)は、同じ意味の字(岳・嶺・峰・嶽・岡など)に替える**(Gin「いや、地理的に呼ぶ場合の山（山体）とそれ以外（山田、秋山）は変えようねって話では」2026-10-07。Gin「前者は理だよねと」で確かめた)。前の経緯:HNS-M4の問い「山は理の字として残すか、DIFF-028どおり替えるか」にGin「山は理だっけ？」「変えようか」。これまで「山は理の字で残す」とした町名(翁ケ山・祠山町ほか)と、正本の山の入った名前(須賀山線・朱島金山・伊夜日子山・思兼山・雪割山・翁ケ山)をさかのぼって当てるかは Gin に(未決)。理を犯すかの線:意味を変えない置き換え(山→岳・峰・嶽・嶺・岡など)は理を犯さないとみなして許容(Gin「峰、岳、嶽、峰、岡」「多いからね」「意味を変えない場合は理を犯さないとみなし許容」2026-10-07)。ただし同じ音で意味の違う字への置き換え(あて字)は不可(Gin「同音異義語はNG」「山→耶麻　✗」2026-10-07)。記録:高田→鷹田(同じ音)は、Gin の個別の裁定(高いところを飛ぶ鷹)で、この線の前の例外。追記(2026-10-24):現象の名(海流・季節風 など)。潮 などの字は この決まりどおり替える。ただし 黒潮・親潮 のように一つの言葉として意味がまとまる名は、単語の表で止めて替えない(高原・温泉郷 と同じ、字を替えると言葉でなくなる)。線は A(DIFF-026)に入れず B のまま(案 ウ。docs/proposals/2026-10-24_kotowari_flow.md、C5 も賛成)。HNS-M4 の問い「現象の名は ウ」にGin「3,ok」(2026-10-24、HNS-M4 のセッション)。前の経緯:Gin「黒潮、親潮っていうその海流の流れのことを指しているのであれば、これは理じゃないかな」(HNS-G5 のセッション、元の字は 断り)。追記(2026-10-24、二つ目):①昼・晩・夕 を例に足した。Gin「朝、昼、晩も時制だから理？」→HNS-M4「理に入る。暦の名とは分ける」→HNS-M4 の最終確認の表にGin「はい」(2026-10-24、HNS-M4 のセッション)。②字の表に 塩⇄潮(相互)を入れ、例を 塩→潮・磯→汐 に。HNS-M4 の問い「5 塩⇄潮 ア 相互」にGin「5,アで良いが、八、来が変わらない理由を教えて」→HNS-M4 の答え(八 は数の字、来 は字の表にも理の言葉にもない。下書きの 八塩〈やしお、元の読みのまま〉・塩来〈いたこ と読む根拠がない〉は使えない)→HNS-M4 の最終確認の表にGin「はい」(2026-10-24、HNS-M4 のセッション)。八潮市・潮来市 は名ごとに作る(HNS-G5 に候補を頼む)→八潮市＝八浪市・潮止＝浪止、潮来市＝板久市(2026-10-25、正本の行)。来・行・待 など人の動きの字は理に入れない(イ:ふつうの字として名ごとに、DIFF-016 の対字・近い意味。音だけで当てた字〈潮来 の 来＝こ〉は DIFF-018 で名ごとに)。HNS-M4 の問い(ア 替えない理に/イ 名ごとに/ウ 字の表に組で)のあとGin「とりあえず現状のルールに照らしてわかる既決地名の「例外」と、どうする(維持、変更)のが推奨かをまとめられる？」「裁定待ちは取りあえず裁定します(旧呼称の継続利用ルートも弊害が無いか確認して問題なさそうなら裁定で構いません)」(2026-10-25、HNS-M4 のセッション。HNS-M4 の推しで裁定、と読んだ)。文の直し(2026-10-25):替えない字の括弧を「文は DIFF-026 を見よ」に(HNS-C5 の査読 docs/reviews/2026-10-25_review_diff026_028_text_C5.md)。塩竈市(DIFF-040)・北塩原村 は機械で替えない。作中の 汐 の元は、塩沢＝潮谷 で 磯(汐子区)だけになる。③単語の表に 日の出→陽の出・日ノ出→陽ノ出・夕日→夕暉・夕陽→夕暉・北斗→北斗(HNS-M4 の問い「2 陽の出・夕暉・北斗 はそのまま」にGin「1,ok 2,ok 3,ok 4,ok」、docs/proposals/2026-10-24_kotowari_placenames.md §9)"
  - id: DIFF-029
    item: "日ノ本の歴史には実在の人物がいる(郷土史は人なしに成り立たない)。人名はそのまま。ただし地名から取った名字(伊達氏←伊達郡など)は、その地名と一緒に日ノ本の名前に替える(伊達政宗→糸館政宗の形)。下の名前と、土地に由来しない名字はそのまま。範囲は、上は都道府県、下は町名の段まで。それより細かい地名と同じ名字は「偶然の一致」として扱ってよい。替えるのは名字だけ"
    status: "Gin裁定(2026-10-05、HNS-Orcの問い「実在の人物を出さないという制約は正本にない」のあと、Gin「実在人物を出さないという制約ってあったっけ」「でも歴史需要の人物なしに強度知って成り立たないよね？同じ地形を基にするならなおさら」、HNS-Orcの案(地名から取った名字だけ地名と一緒に替える)にGin「そうだね、上は都道府県」「下は町名レベルで、と考えれば偶然の一致路線も言い張れなくはないから」「名字だけ変え、だね」)。前の記録:政宗市の棄却の理由「本世界にも伊達政宗がいる」はHNS側の読み取りだった。関連:伊達＝糸館(docs/proposals/2026-10-05_date_itodate.md)、かごの人名由来地名"
  - id: DIFF-030
    item: "府県と、府県庁のある市の名前の組み方は、現実と同じ形にする。現実で同じ名前なら同じ名前(千葉県千葉市＝万葛県万葛市、京都府京都市＝雅府・雅市、大阪府大阪市＝千橋府・千橋市)。現実で違う名前なら違う名前(神奈川県横浜市＝仏名瀬県おうはま市)"
    status: "Gin裁定(2026-10-05、HNS-NGのセッション。Gin「万葛県万葛市」、NGの問い「京都と大阪も、府と市を同じ名前（雅府・雅市、千橋府・千橋市）にしてよいですか」にGin「ok」)。神奈川のときのGin「仏名瀬県おうはま市」とそろう。雅府・千橋府そのものの採否は束4の採決待ち"
  - id: DIFF-031
    item: "県名の音読み・訓読み:検証した結果、実際の命名規則(現実の都道府県名)でも混在を確認したため、ルールの変更はなかった。現実の47都道府県:訓読み28・音読み11(北海道・群馬・東京・岐阜・愛知・滋賀・京都・兵庫・奈良・高知・佐賀)・混ぜ読み8(福島・埼玉・神奈川・福井・和歌山・徳島・福岡・鹿児島)。愛媛の「え」・大分の「いた」は古い読み・当て字で決めにくい(HNS-Orcの知識による分類)。日ノ本の県名も、音・訓・混ぜ読みのどれでもよく、言いやすさ(DIFF-025)と同じ音の言葉(C-04)を見る"
    status: "記録(2026-10-06、Gin「件名って音読み訓読みのルールってあったりする？」「福島は？」「だから混ぜるのに抵抗がなかったんだけど、もともと混ざってたんだね」「一応「検証した結果、実際の命名規則でも混在を確認したためルールの変更はなかった」胸は記録しておいて」)。HNS-Orcは途中で福島・宮崎・愛知の分け方を誤り、Ginの問いで直した"
  - id: DIFF-032
    item: "列車の愛称など、山や地名から取った名前は、もとの山・地名の日ノ本の名前から付ける(たにがわ←谷川岳＝双耳岳→ふたみみ)。山・地名を先に決め、愛称はそこから決まる(親から片付ける)。現実の例:あさま(浅間山)・つるぎ(剱岳)ほか、山から取った愛称は同じ形で片付ける"
    status: "Gin裁定(2026-10-06。東柳新幹線の愛称でGin「とき　が　あけ」「（たにがわ）　が　（谷川の変換後）」「ふたみみ　だね」のあと、Gin「この命名規則で結構山地命名楽になると思うんだ　逆縁だけど一本だし」、HNS-Orcの文案にGin「お願いします」)。HNS-Orcの読み取り:「逆縁」は、ふつうと逆に山から列車へ名前がつながるが、それでも一本の糸で決まる、の意と受け取った(違えば直す)"
  - id: DIFF-033
    item: "府県名に同じ字が並んでもよい(現実でも山6・島5・福3・岡3・川3ほかが並ぶ)。例:白暉・饒日(日の音・字の近さ)、京鹿・鹿桜(鹿)、椿先と市の名の標先・柿先(先)。PRE-011(同じ字の重なり)は記録どまりで、名前を外す理由にはしない"
    status: "Gin裁定(2026-10-06。HNS-Orcの問い「現実と同じく、県名に同じ字が並んでもよいと決めてよいか」のあと、Gin「福島、福井、福岡みたいなもん？」「この内候補が出ているところは？」、九州・四国の7つの採決で、HNS-Orcの「Aの場合は『日』の字が白暉・饒日の二県に並んでもよいことも決まった、と記録します」にGin「あ」)。HNS-Orcの読み取り(違えば直す)"
  - id: DIFF-034
    item: "府県の花・木・鳥・魚などのシンボルは現実準拠(現実と同じ、揺らさない)。柳都県なら県の花＝チューリップ、県の鳥＝トキ、県の木＝ユキツバキ。47府県の一覧は正本の prefecture_symbols。未決:名前に現実の地名を含むもの(秋田杉・タテヤマスギ・越前ガニ・伊勢えび・北山杉・豊後梅・リュウキュウマツなど)を、地名の日ノ本名に合わせて替えるか(DIFF-032の形)、そのままか"
    status: "Gin裁定(2026-10-06、ALM総監督経由。Gin「県の花、鳥、木、などは現実準拠で良いと思う」。ALMでは docs/city_plan.md)。地名を含む名前の扱いはHNS-Orcの気づき、Ginに未確認"
  - id: DIFF-035
    item: "町名(郵便番号の町域)の段では、基本は変える。古称・旧国名、人の名から付いた名、ほかの土地や会社の名と同じ名も変える。どうしても「理だな」と思えるもの(普通の名詞・元号・神仏の名など)だけ協議にかける。DIFF-026(替えない字)・DIFF-027(よくある名前)はそのまま"
    status: "Gin裁定(2026-10-06、りゅうと市中央区の町名の仕分けで。Gin「基本は変える方向で行きましょう」「で、どうしても「理だな」と言うものは教義」。HNS-Orcの読み取り:教義＝協議の打ち間違い、違えば直す)。記録:docs/proposals/2026-10-06_ryuto_chuo_towns.md。追記(2026-10-06):施設や役目を言う普通の名詞の町名(学校町・水道町・医学町通・寄附町ほか)は許容(Gin「２，許容（文京区も許容？」)。文京は1947年に文京区のために作られた瑞祥地名(Wikipedia「文京区」)なので、普通の名詞とは別に扱うかを Gin に(未決)。元号はDIFF-023(まるごと新しい名前)との兼ね合いを Gin に(Gin「３，許容しかない場合は許容。代替できそうなら入植時期意外だったらどんな名前がつくか検討…とも思ったけど、全国にいっぱい同じ名前が在る地名という感情は捨てるのはもったいないと主たり」)。神仏の名の町名(天神・弁天・愛宕・稲荷・毘沙門・白山ほか)も許容(Gin「４，同上。恵比寿は東京にも大阪にもある、どう考えるか」)。HNS-Orcの見立て(未決):神の名→神社→町名の流れは許容、神の名→商品名(ヱビスビール)→町名の流れ(渋谷区の恵比寿、Wikipedia「恵比寿 (渋谷区)」)は会社・商品から付いた名として替える側。京都のように特定の寺社の固有の名(清水・八坂・祇園ほか)が多い土地は、神の名(全国にある)と寺社の固有名を分けて考えるかを協議"
  - id: DIFF-036
    item: "生きものの標準和名に地名が入っているもの(エゾマツ・ミヤギノハギ・キュウシュウジカ・リュウキュウマツ・ミヤマキリシマ・ニホンカモシカほか)は、土地準拠。その土地の固有の種だからその名が与えられたと考え、名前の中の地名を、その土地の日ノ本名に合わせて替える(DIFF-032と同じ形。例:キュウシュウジカ→火守道の名から、ニホンカモシカ→日ノ本の名から)。親の土地の名が決まっていないものは親待ち"
    status: "Gin裁定(2026-10-06。HNS-Orcの協議の問い「標準和名そのものに地名が入っているものは、図鑑の名なので理の側か」に、Gin「１，因果が逆、その土地の固有種だからその標準学名が与えられていると考えるべき。だから土地準拠」)。前の流れ:Gin「地名の場合は置換、古称の場合は許容、とか？」「地名イリの名前はひょうじゅんがくめいでの置換を検討」。旧国名(武蔵・伊勢)・古称(蝦夷・琉球)が入る種の名の扱いは未決(RUL-023・国の層との関係)"
  - id: DIFF-037
    item: "同じ字・同じ名前に行き着いている地名でも、由来(名前の来た道)で見分けて HNS にかける。由来が日ノ本で変わるもの(会社・商品・ほかの土地の名から付いた名)は変わる、由来が変わらないもの(神仏の名・普通の名詞など、許容したもの)はそのまま。例:恵比寿＝渋谷区の恵比寿はヱビスビールから(Wikipedia「恵比寿 (渋谷区)」)で替える側、神社の戎から付いた恵比寿は許容の側"
    status: "Gin裁定(2026-10-06。Gin「４，同上。恵比寿は東京にも大阪にもある、どう考えるか」「京都とか頭痛いね」、HNS-Orcの見立て(神社から来た名と商品から来た名を分ける)のあと、Gin「なので、結果的に同名に収束している場合でも由来が変われば変わるものとそうでないものを識別してHNSにかけるしかないのではないかと」)。HNS-Orcの読み取り(違えば直す)。由来が確かめられないものは、確かめてから判定(未確認のまま決めない)"
  - id: DIFF-038
    item: "英字(ローマ字)の綴りは、一字ずつの元の音で綴る(相津＝Aitsu、Aizu にしない)。読み(ルビ・声)は名前の表どおり(あいづ)。濁るかどうかは前の言葉で決まる音の変化なので、英字には持ち込まない"
    status: "Gin裁定(2026-10-08、ALM総監督経由。Gin の理由:「津」が濁るかは前につく言葉で決まる〈会津＝あいづ、新津＝にいつ、両津＝りょうつ、津市＝つ〉、ツとヅはもともと曖昧、aizu と打つと あいず になり「合図」しか出ない、aitsu なら字ごとの元の音に行き着く)。例:RTVA-TVHN＝Rokushima TeleVision Aitsu"
  - id: DIFF-039
    item: "字は、簡単な字で済むなら簡単な字を優先する(磐浜は浜、濱にしない)。理由つきで裁定済みの字はそのまま"
    status: "Gin裁定(2026-10-08、ALM総監督経由。Gin「基本簡単で済めば簡単な字を優先してください」)"
  - id: DIFF-040
    item: "震災のあった土地の名前も、例外なくずらす。そのうえで、変わらないもの(その場所にあり続けるもの、その土地の人が何を遺したいか)を極限まで考え尽くして決める。出来事の名残からではなく、出来事より前からそこにあり、これからもあり続けるもの(山・川・海・産物・祭り・人の営み)から取り、案ごとに由来と、その土地の人がどう受け取るかを書き添える。急がない(RUL-025 と同じ筋)"
    status: "Gin裁定(2026-10-09、ALM総監督経由、原文のまま):「震災があった場所の地名も例外なくずらします。ただ、変わらないもの。その場所にあり続けるもの、その土地の人がなにを遺したいか。これを極限まで考え尽くして決めます。このことにGPU使ったならまあ良いか、と見た人が思えるほど、愛に溢れて美しくて貴い名前にします　禄嶋は、変わらない」。当てる所:浜の筋の双葉郡(広野・楢葉・富岡・川内・大熊・双葉・浪江・葛尾)、飯舘、相馬・南相馬・新地、磐浜の沿岸など"
  - id: DIFF-041
    item: "世界の国名・首都の名前:明治の頃の漢字の国名(当て字)を土台に、HNS の揺らしを入れる。音からではなく、その国・都市の名の意味(語源)から揺らす。語源が民族名や支配の歴史にからむもの、明治の呼び方に差別の意味を帯びたものは、一つずつ慎重に(震災の土地と同じ心で)。首都も同じ決まり。東都はそのまま"
    status: "方針(2026-10-09、ALM総監督経由)。Gin「良いね、そのルールだと日ノ本でも違和感がないわけか」「お願いします。同様のルールで首都くらいは決めといてもいいかも」「（HNSによる揺らしあり）」「意味から揺らす」。名付けの心(原文のまま):「戦争は人の業、避けられないとするならば、せめてアイを以て。」(Gin が「持って」を「以て」に直した)。アイは AI と愛の重なり。未決:読みを現実と同じにするか、略字(米・英など)、当て字のない国の決まり。大きな仕事なので重さを先に Gin に伝えてから"
  - id: DIFF-042
    item: "名前を替える所(局名・市町村名など)では、数の字を大字にずらしてよい(壱・弐・参・肆・伍・陸・漆・捌・玖・拾)。字は簡単なほうを優先(貳でなく弐、DIFF-039)。読みは元の数の読みのまま(弐本樅＝にほんもみ)。合う所だけに使い、機械的に全部へは当てない。郵便番号の町名など、名前を替えない所の数の字はそのまま(DIFF-026)。前例:三条市＝参坊"
    status: "Gin裁定(2026-10-09。三島の三を桐に替えた案に、HNS-M4「数は替えない字(DIFF-026)」→Gin「参」「貳」「壱」→HNS-M4の案 A(名前を替える所だけ)に Gin「良いと思いますか」→HNS-M4の考え→Gin「簡単な方で良いです」)。記録:四日市市＝泗浜端市は DIFF-026 より前の名で、四→泗は別称「泗水」からの当て替えなので前例として残す"
  - id: DIFF-043
    item: "読みの長さは、元の読みの音(拍)の数に近づける。5音以上になるのは、どうしても避けられないときだけ。あわせて、元と同じ音はなるべく当てない(元の読みを丸ごと入れない、の決まりを広げたもの)。数え方は DIFF-024 と同じ拍(小さいゃゅょは前の音と一つ、っ・ん・のばす音は一つ)。町・村・市などの部分は数えない。県の4音まで(DIFF-024)はそのまま"
    status: "Gin裁定(2026-10-10。柳津町＝楊湊〈やなぎみなと、6音〉に Gin「やなぎみなと長いな」「やないづ　だからね」→HNS-G5の縮める案(楊江〈やなえ、3音〉・楊浜〈やなはま、4音〉)→Gin「読みが五文字以上はどうしても避けられない時は仕方ないけど基本的には元の読みの文字数に近づける(かつおなじおとをなるべくあてない)にしたいんだけど」)。これからの候補出し・査読の物差し。採用済みの名を遡って直すかは別に決める"
    addendum: "追記(2026-10-10、Gin裁定、HNS-E5 のセッション):元の文字数に近づけることを努力目標にする。競合(同じ名前とのぶつかり)でやむを得ず変える場合も、なるべく元の文字数に近くなるよう候補を選ぶ。文字数は本文と同じく拍で数える(はじめ「読み〈かな〉の数」と書いたのは HNS-E5 の読み違い。HNS-E5 の問い「追記の数え方を『かなの数』から『拍』に直して、本文とそろえてよいか」に Gin「はい」、2026-10-10)。数え方の例:じゅんぴょう町＝じゅ・ん・ぴょ・う の4拍(町は数えない。かなで数えると6)。Gin「あるかわからんけど じゅんぴょうちょう のようなものも拍だと4になるということよね」→HNS-E5 の説明→Gin「承認です」(2026-10-10、HNS-E5 のセッション)。県の4拍まで(DIFF-024)とは別に、市町村・町名・局名にも当てる。Gin「あと、基本的に元の文字数に近づけることを努力目標として、競合でやむを得ず変える場合はなるべく元の文字数に近くなるよう候補選びをする、をルールにしましょう」。わけ:Gin「じゃないと文字数増やせば競合ない、を連発してしまいそうなので」(字や音を足して長くすれば同じ名前とのぶつかりはいくらでも避けられる、その逃げ道に頼らないための歯止め)。きっかけ:川内村の蛙森(かわずもり、5)と元の かわうち(4)。記録 docs/reviews/2026-10-10_review_tuf_parents_remake_NG.md §8"
  - id: DIFF-044
    item: "二つの旧国名を合わせてできた名(常磐＝常陸＋磐城など)は、それぞれの旧国名の日ノ本名から一字ずつ取って作る。元の名と字・音が重なる字は避け、その日ノ本名のもう一方の字を取る(常磐:常陸＝永陸の永、磐城＝磐汀の 磐 は元の常磐と字・音が重なるので 汀 → 永汀)。RUL-023 ②(旧国名の一字)を、親が二つある名に広げたもの"
    status: "Gin裁定(2026-10-13、HNS-G5 のセッション。HNS-C5 の問い「RUL-023 ② の拡張として承認するか」→Gin「広げた場合の懸念点を提示」→HNS-G5 の懸念(総武・房総・両毛・甲信・筑豊への広がり、親の名を先に決める縛り、どの一字を取るかの揺れ、常磐から生まれた名がまとめて替わること)→Gin「磐、文字は二文字元と被るんだね」→Gin「永汀で行きましょう」)。記録 docs/proposals/2026-10-13_joban.md §7。同じ形の名(総武・房総・両毛・甲信・筑豊ほか)は、親の旧国名の日ノ本名が決まってから当てる"
  - id: DIFF-045
    item: "町域の名(市の中の町名・大字など)は、ほかの市の町域の名と同じになってよい。重なりを見るのは、自治体の名・駅・施設・よく知られた地名など(DIFF-021)。同じ元の名の町域(公田町が横浜市栄区と前橋市にある、など)は、同じ日ノ本名にしてよい"
    status: "Gin裁定(2026-10-21、HNS-M4 のセッション。公田町＝供苗町 の話で、HNS-M4「横浜市栄区と前橋市のどちらか」→Gin「どちらも同じ」「町域はかぶり許容」→HNS-M4「すべての町域に当てはまるか、公田町だけか」→Gin「1」(すべての町域))。査読の基準として HNS-C5 の記録(追記5)にもある"
  - id: DIFF-046
    item: "字の重なりを見るのは、市町村・町域(大字・町名)・駅・施設・よく知られた地名まで。小字・集落の名は見ない(全国の一覧がなく、見きれないため)"
    status: "Gin裁定(2026-10-21、HNS-M4 のセッション。広野町＝泰原町 の照らしで、HNS-C5 が国土地理院の住所検索から奈良県宇陀郡御杖村の中の小字とみられる 泰原 を見つけた→HNS-M4「小字までかけるか」→Gin「どうするかね」→HNS-M4のおすすめ(小字は見ない)→Gin「昭和村は元号だから理として、これも小字ではゴロゴロしてるだろうしね」→Gin「採決」)"
  - id: DIFF-047
    item: "元号から名を取った地名(昭和村・昭和町・平成町など)は、元号のまま残す。現実の地名と同じ字になるが、DIFF-021 の例外として認める。上の郡などの名は日ノ本名に変わる"
    status: "Gin裁定(2026-10-21、HNS-M4 のセッション。原文のまま:「言語を共有するから、そこを変えちゃうと成り立たなくなってしまうから。」「元号を共有する以上、成立年の元号で町名を付けている場所が被るのは避けられないかと」「その上の郡単位は必ず変わるから」→「採決」)。RUL-024・DIFF-023 の改め(中継局の 昭和・東昭和)と同じ筋"
  - id: DIFF-048
    item: "政令指定都市の区(行政区)で、現実にほかの市にも同じ名の区があるもの(緑区5・青葉・泉・鶴見・旭・港 各2 など)は、同じ日ノ本名にそろえる(DIFF-045 の町域と同じ考え。区は自治体ではない)"
    status: "Gin裁定(2026-10-21、HNS-M4 のセッション。HNS-G5 の区の全体の表 docs/proposals/2026-10-21_seirei_wards_table.md の問い→HNS-M4「1 同じ日ノ本名にそろえる／2 市ごとに別の名」→Gin「2,1」)"
  - id: DIFF-049
    item: "政令指定都市の区の名は、ほかの市の町域の名と同じ字になってよい(賑区と賑町〈名古屋市中村区・堺市堺区・長崎市〉など)。由来の違う同じ名の区(仙台の青葉・泉 と横浜の青葉・泉)も DIFF-048 でそろえる。ルビの要る区の名(鶴廻 つるわ など)にはルビをつける"
    status: "Gin裁定(2026-10-21、HNS-M4 のセッション。HNS-G5 のおうはま市の区の提案 docs/proposals/2026-10-21_wards_ohama.md の問いに、Gin「区の名が、ほかの市の町域と同じ字になってよいか ok」「仙台の 青葉区・泉区 も、横浜とそろえるか ok」「鶴廻（つるわ）にルビをつけるか はい」)。港区は 埠区 を採らず 碇区(いかりく)に決まった(Gin「碇区(いかりをおろすことから)」→「1〜3」2026-10-21、正本 fd7c9e9。この行の「埠区は未決」は書き残しだったので直した、HNS-M4 2026-10-23)"
  - id: DIFF-050
    item: "字の表の 野→原 の一対一は崩さない(元の名の 野 は 原 に替える)。例外が要るときは、理由をつけて単語の表に足す。改め(2026-10-23):字の表の組はすべて入れ替え(相互)にする(野⇄原・代⇄坪・浦⇄岸、田⇄苗 と同じ)。これから足す組もはじめから相互で作る。高原・河岸・平野 のような一つの言葉は、字でなく単語の表で止める。字の表に次点を書き(野・原 とも 平)、既定で替えた名が現実の名と重なったら、まず次点で試す。平 を使った名には元の字を記録する。機械で替えるのは下書きまで(現実との重複は道具で拾い、重なった名だけ名前ごとに考える)。地名は字の表と同意異字で作り、由来をたどって作るのは旧国名だけ。これまでに決めた名は動かさない"
    status: "Gin裁定(2026-10-22、HNS-M4 のセッション)。Gin「野、原の一意は崩さない方が良い？」(HNS-G5 のセッション)→HNS-G5「崩さない。例外は単語の表に理由をつけて足す」→HNS-M4「決まりにするか」→Gin「1〜3」。改め:Gin「入れ替え強制ではなくて一方通行のパターンもあるの？」「ここまでそのつもりで作ってきてたんだけど決まってなかったのね」「このルールに照らすと機械変換は結構貯まるんじゃないかと」「相互にすれば」「意味が通らない、現実重複は当然でてくると思うけど」「同意異字は認めるみたいなニュアンスでやってた気がするなこれ」「プランB的に決めておくのはいいかも」「地名でこれやるとコストで死ぬからせめて旧律令だけはこの方式でやろうか、ここからは」(HNS-G5 のセッション、docs/proposals/2026-10-23_no_hara_swap.md・2026-10-23_kyukokumei_order.md 追記)→HNS-C5 査読 受け入れ可→HNS-M4「登録してよいですか？」にGin「b,ok」(2026-10-23、HNS-M4 のセッション)。平野 はGin「越後平野のへいや、は平野部の平野です」(2026-10-23、HNS-M4 のセッション)。相互化で合わなくなった採用の名(HNS-C5 の査読):阿賀野川 閼伽野川→閼伽原川(Gin「アカハラが泳いでる川に重なるから閼伽原でも良いかと」)、祖父興野 祖母興野→祖母起原(おばぎはら、Gin「祖母起原」、江南区の同じ町域も)、越後平野 柳都平野 は単語の表の 平野 で止め、前の字は 渡後 に(渡後平野、DIFF-055、Gin「1,ok」)"
  - id: DIFF-051
    item: "旧国名の日ノ本名は、要る所から付けていく(C)。付けた国は、歴史の呼び名も日ノ本名にそろえる(尾張の歴史は 殿伸)。旧国名の実名を日ノ本名の中にそのまま使う例外は作らない(陸奥＝東北 も替える)。86 か国の表を正本の kyukokumei に置き、npm test(check-kyukokumei)で、採用の名に旧国名の実名が入っていないかを毎回確かめる"
    status: "Gin裁定(2026-10-22、HNS-M4 のセッション)。Gin「陸奥、というか旧律令の呼び名を精査」→HNS-G5 の表(docs/proposals/2026-10-22_kyukokumei_table.md)→問い2「A 実名のまま／B 86すべて／C 要る所から」にM4の案「C にして、表を正本に入れる・自動の確かめ・決まりの書き直し」→Gin「１」(Gin の不安「随時だと今回みたいに総点検が必要になるのではという不安」への手当て)。問い1 陸奥「ア 残す／イ 東北に新しい名／ウ 律令の国だけ替える」→Gin「どっちかに統一したいんだよね」→M4「1 陸奥の字の使い方を一つに／2 旧国名の扱いを全部そろえる(例外を作らない＝イ)」→Gin「２」。替わる名:陸奥・陸奥新幹線・都浜陸奥線、県の親の 陸奥(地方)、ALM の作品の中の 陸奥。10-03 の「国の層は歴史の呼び名として残す」(kyukokumei_check §6・RUL-023)はこれで改める。改め(2026-10-23):要る所から(C)ではなく、層ごと全部作る。Gin「これを決めれば芋づるで決まるの結構ありそうだし、次はこのレイヤー行きます」→M4「範囲は68か86か」→Gin「全て決めます」→Gin「効果の大きいところから順にやりましょう」→順はGin「おまかせします」でM4が決めた(docs/proposals/2026-10-23_kyukokumei_order.md)。信濃＝科坂・越後＝渡後・上野＝上叢 を登録(2026-10-23、HNS-M4 のセッション。docs/proposals/2026-10-23_nagano_city.md)"
    open: "~~東北の新しい名~~ → 柵北(さくほく)(Gin「１」2026-10-22)。陸奥新幹線＝柵北新幹線、都浜陸奥線＝都浜柵北線、6県の親＝柵北(地方)。因幡野町(因幡の実名、2026-10-11 Gin の例外)は替える(M4 の問い「例外を作らない決まりに合わせて替えるか、残すか」→Gin「変えましょう」2026-10-22)→穂敷兎町(ほしきとまち)(Gin の案、Gin「１，おｋ」2026-10-22)。これで正本の採用の名に旧国名の実名はない"
  - id: DIFF-052
    item: "世界の名の原理原則:名が付いた瞬間を一歩ずらして、そこから歴史を流し直す。理はずらさない。(1)ずらすのは名の終わりの形ではなく、名が付いた瞬間(名の元の言葉・人・印象)。例:火ノ本→Hapan、eurús→platús(Platopa)、Amerigo→Henricus(Henrica)。(2)そのあとの訳・略・借用・当て字は、現実と同じ道筋で自然に流れたことにする(Platopa→プラトッパ→望羅都巴→望州)。名の元と関わりなく作られた名は、それ自体の名が付いた瞬間で見る。(3)理はずらさない(方角・極・元号など、DIFF-026・RUL-024)。(4)日ノ本も世界も同じ物差しで見る"
    status: "Gin の意向(2026-10-23、HNS-G5 のセッション):Gin「それを一応原理原則にしたいなとは思います」「決まりをちゃんと決めてしまえば物語は後からこう自然と動くっていう考え方につながる」。文は HNS-G5 の言い方(docs/proposals/2026-10-23_oceans_eurasia_toa.md §6-2、d105891)。起票 HNS-M4。M4 の問い「G5 の書いた文のままでよいか」に Gin「のこりも、ok」「1,ok」(2026-10-23、HNS-M4 のセッション)。Gin裁定"
  - id: DIFF-053
    item: "呼出符号の多重放送の印は、現実の印をそのまま写して HN を付ける。地上:○○○○-TAMHN(音声多重)・-TCMHN(文字多重)・-TDMHN(データ多重)。BS:局の略称-BS-TAM1HN・-TDM1HN(1 の意味は出典なし、そのまま写す)。TVHN・DTHN のような2文字にはそろえない"
    status: "Gin裁定(2026-10-23、HNS-M4 のセッション)。HNS-G5 の提案 docs/proposals/2026-10-22_callsigns.md §6・§7 の問い(ア 現実を写す／イ 頭の2字／ウ T を落とす)に、Gin「アが一番問題が起きづらい(おきようがない)気がするからアにしますか」「そもそもそうした拡張性を見込んでこの並びにしたはずなので」。前の線:Gin「分からなくても倣う前提で」(2026-10-23、HNS-G5 のセッション)"
  - id: DIFF-054
    item: "線の名(路線・局など二つの土地をつなぐ名)は、現実の字の出どころの層(府県か国か)に合わせて、その層の日ノ本の名の一字を取る(京葉＝東京＋千葉→都葛、信越＝信濃＋越後→科渡、磐越＝磐城＋越後→汀渡〈磐城＝磐汀 の 汀、DIFF-044 にそろえる〉、上越＝上野＋越後→叢渡)。ただし、国の名がまだないとき、または同じ音で紛れるときは、府県の字のまま。渡＝ど(呉音、常用漢字表の外)のように表外の読みで読む名には、すべてルビを付ける"
    status: "Gin裁定(2026-10-23、HNS-M4 のセッション)。HNS-G5 の一行案(docs/proposals/2026-10-23_nagano_city.md §9-1)→HNS-C5 の足し(ただし書き、査読 追記4)→M4 の問い「3 線の名の決まりを書き替えてよいか」にGin「詳細」→M4 の説明→Gin「1,ok 2,ou」→M4「2 は ok の打ち間違いか」にGin「ok」。ルビ:M4「渡 を ど と読む名にはルビ」にGin「4,ok」。越後 の 柳 は県(柳都)の字として残し、国には使わない(Gin「b」)。柳都県・りゅうと市 は替えない(Gin「柳都とりゅうとを変えずに」)。気がかり:DIFF-044(常磐＝永汀、元の名と同じ字は避ける)と 磐渡 の 磐 の取り方が違う(HNS-G5・HNS-C5、Gin に問い中)。気がかりの答え:M4「(a) 汀渡西線・東線 に替える／(b) 磐渡 のまま外れとして記録」にGin「a,a」(2026-10-23、HNS-M4 のセッション)。二つの国を合わせた名で、元の名と同じ字になる側は、もう一方の字を取る(DIFF-044)を線の名にも当てる。記録:汀渡＝程度 と同じ音"
  - id: DIFF-055
    item: "国の名がないために RUL-023 の③(まるごと新しい名)や①で作った名は、国の名が決まったら②(旧国名の部分を国の日ノ本名に)に替える。元の名は別の所に残す(相模原市＝凧ヶ平市→冷洋野市、凧ヶ平 は地区の名。軒結市→上ノ渡市・軒結通り と同じ)"
    status: "Gin裁定(2026-10-23、HNS-M4 のセッション)。Gin「凧ヶ平もさがみが決まらないから苦肉の策だった面もあるし冷洋が決まったなら変わるのが筋なんだろうな、軒結と同じで」「規則なら仕方ないって」→HNS-G5 の文(docs/proposals/2026-10-23_no_hara_swap.md 追記2 の4)→HNS-C5 査読(③で作った名の一覧を一度作る)→HNS-M4「G5 の読み『決めてよい』で合っていますか？」にGin「c,ok」。当たる名の一覧:docs/reviews/2026-10-23_kuni_less_names_M4.md。越後平野:柳都平野→渡後平野(Gin「渡後平野です」「1,ok」2026-10-23)"
  - id: DIFF-056
    item: "善光寺(長野市)の日ノ本名。悠原 は長野村(善光寺の門前)の地形から作ったので、寺の名が決まると悠原の町の芯が定まる。ことわざ「牛に引かれて善光寺参り」も寺の名で決まる"
    status: "判断待ち(2026-10-24、HNS-M4 のセッション)。M4 の問い「善光寺 の名を、判断待ちの一覧に足すか」にGin「1,ok」(「これは前の1〜3」)。名は未着手"
  - id: DIFF-057
    item: "字の表に 戸⇄口 を相互の組として入れる(戸→口 次点 扉、口→戸 次点 門)。作中の 口 の元は 戸 だけ、作中の 戸 の元は 口 だけ。作中の 門 は 関⇄門 の組にそろえる。駅の出入り口の 口(万代口 など)と、土地の姿から付けた言葉の 口(谷口 など)は当てない。これで 山口県・山口市＝鶴戸、柏崎山口中継局＝標先岳戸、小千谷真人中継局＝錦谷真徒(人→徒)。川口(新潟の中継局・川口市・文化放送の川口送信所、同字一括)は 河戸 が実在の町域・駅とぶつかるので、Gin の案 流戸(ながれど)に決めた"
    status: "Gin裁定(2026-10-24、HNS-M4 のセッション)。Gin「門は一方通行？門→関」「これ相互は無理があるのか」「夜中に見たくなかったなーこのもつれは」「いや、口を一位に変えられる仕組みの方がいい、まだ子を実装してない山口ならキズガ少ないんじゃないかと」「ここをちゃんと決めれば柏崎山口も決まるって事でしょ」→HNS-M4 の問い「ア：戸⇄口 を相互の組にする(推し)／イ：口→門 に一本化する」にGin「アで」→HNS-G5 の案(docs/proposals/2026-10-24_to_kuchi.md)→Gin「ok」。川口:Gin「河を、考える？」「流戸(ながれど)？」→HNS-G5 の照らし 0→Gin「相津流戸駅」「ok」で 川口＝流戸(ながれど)、一括。三川中継局＝閼伽瀬(あかぜ、意義変換、Gin の案)も同じ日に"
