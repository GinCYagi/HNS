  - "国の層(越前・越中・越後、備前・備中・備後、豊前・豊後など)の名前は、歴史の呼び名のまま残す。作品の台詞や地図に国の名前がそのまま出てきたときに、親の国(越・吉備・筑紫・豊・肥・総・毛野など)から考える(Gin「悩むね」→HNS-Revの推しに「そうだね」「元にしてる地図地形が同じなんだからそのくらいはリンクしてもバチはあたらんか」2026-10-03。高志・古志はNG否寄り、docs/proposals/2026-10-03_kuni_oya.md)"
