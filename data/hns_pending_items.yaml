    status: "起票(2026-10-01)"
  - id: DIFF-013
    item: "実在する道路の別称(〇〇道)との同名をC系のどこで照合するか"
    status: "起票(2026-09-30、権現道の査読)"
  - id: DIFF-014
    item: "現役の列車愛称をC-01の対象に含めるか"
    status: "起票(2026-09-30)"
  - id: DIFF-015
    item: "HNSの範囲の拡張(名前の巻のほかに、見た目と遺伝の巻など)"
    status: "構想(2026-10-01 Gin「総べ全ての理が集まる場所」)"
  - id: DIFF-016
    item: "対字置換：地名を一字ずつ対の字・近い意味の字に替える作り方(寺泊野積→社帰原重、大河津→広川辺、長岡→短山)"
    status: "起票(2026-10-02、Gin「３，OK」：HNS-Revの問い「一字ずつ対の字や近い字に替える作り方を、名前の決まりの候補として記録してもいいですか」への答え)。G-05(地形反転は禁止)との関係はVer.0.2で整理。対の字が格・規模の対(大⇔小、長⇔短、高⇔低)になるときはC-06に当たる(NG、小波の判例PRE-003の抜け道にしない)。同じ字の別の書き方(数の大字 十→什・三→参、異体字 島→嶋)もこの型に含む(NG、2026-10-03)"
  - id: DIFF-017
    item: "RUL-018(動物の字を含む地名は残す)の補い：対になる鳥・縁のある鳥に替えるのはよい(鶴ヶ城→青鷺城、燕→雀)"
    status: "起票(2026-10-02、Gin「２，OK」：HNS-Revの問い「鶴を青鷺に、燕を雀にしたように、対になる鳥に替えるのはかまわない、とまとめてもいいですか」への答え)。RULとして採番するかはGin"
  - id: DIFF-020
    item: "七道の名は字数に縛らない。一字(雪路・嶺路)、二字(火守道・神府道、案の海つ道)、三字(案の補陀落道)のどれも、C系の衝突がなければ許す"
    status: "起票(2026-10-03、Gin「一文字と道パターンありですね」「既存は2文字+道縛りだったと思うのでその辺で差別化するのはありだとおもう」「二字に縛られず一文字、三文字も(コンフリクトがなければ)許容する方針です」、HNS-NGのセッション)。総称:五畿七道は区分の数え方の呼び名として使い、一つひとつの名前の字(道・路)には縛られない(Gin「いっそのこと五畿七路で差別化するのはありかと思ったんだけど、混同でも問題ないと言えばそれはそう」「いみはどちらもみちなので」2026-10-03。五畿七路は考えた案として記録、Ginの一言で切り替えられる)"
  - id: DIFF-019
    item: "県・地方の名前の物差し:元の名前を使わずに、どれだけその場所を想像できるか。型は雅称(柳都県)でも旧国名(尾張府)でもよい。旧国名が今の市町の名前(字・かな:磐城→いわき市、陸奥→むつ市ほか)と重なる所ではそのまま当てない"
    status: "起票(2026-10-03、Gin「元の名前を使わないでどれだけその場所を想像できるか、が一つの根拠になっていると思います」「ただ、旧国名が現在と被っている場所もあるはずなんです(磐城→いわき市)」)。RUL-011(47都道府県)の前提"
  - id: DIFF-018
    item: "当て字・縮め読み：字の決まった読みにない読みを使う名前(什旭町の旭＝く〈旭の部品の九の音〉、広川辺の川＝か〈かわの縮め〉、夜来津代橋〈音からの当て字〉)。①ルビ必須(C-07) ②その読みのわけを記録に残す ③一つの土地に当て字を重ねすぎない"
    status: "Gin承認(2026-10-03、Gin「ルールは承認、のこします」:HNS-Revの問い「この3つを、名前の決まりの候補(DIFF-018「当て字・縮め読み」)として記録しておきますか」への答え)。RULとして採番するかはVer.0.2で"
