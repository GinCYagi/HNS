    status: "起票(2026-10-02、Gin「３，OK」：HNS-Revの問い「一字ずつ対の字や近い字に替える作り方を、名前の決まりの候補として記録してもいいですか」への答え)。G-05(地形反転は禁止)との関係はVer.0.2で整理。対の字が格・規模の対(大⇔小、長⇔短、高⇔低)になるときはC-06に当たる(NG、小波の判例PRE-003の抜け道にしない)。同じ字の別の書き方(数の大字 十→什・三→参、異体字 島→嶋)もこの型に含む(NG、2026-10-03)。知見(決まりではない):対はその地名の中での字の意味で取る。同じ字の別の意味から対を取らない(米沢の米はお米、メートルの米と見て碼〈ヤード〉に替えると土地の魅力が消える。碼瀬〈ばせ〉は馬瀬と同音)。Gin「いや、異意味想定は使わない方が良いというナレッジだけ遺してくれれば」(2026-10-04、HNS-NGのセッション。手引きREVIEW_GUIDE §3.2にも一行、88b31ae)"
