admin_divisions:
  - id: A000
    real: "畿内"
    fictional: "五国府"
    yomi: "ごこう"
    scope: "畿内は五か国のまま:大和・山城・摂津・河内・和泉(五つの国の国府を抱えるので五国府)。五畿七道と合う"
    ruling: "Gin「３、そうだ、ごこう、いこう」「でもきれいだと思うんだけど＋２なった原因ってなんだっけ」「後光、信仰の地だからと理由づけられなくもない」「ごこうにしましょう」(2026-10-02、HNS-E5経由)"
    origin_memo: "五つの国の国府を抱えるので五国府。後光と同音、信仰の地の掛詞(Gin)。御幸(ごこう、上皇のお出かけ)とも重なる二つ目の掛詞(NG、害なし)"
    conditions_2026_10:
      - "C-07:「ごこくふ」と読まれやすい。台本はルビ必須。「五国」と略さない(読みが変わる)"
      - "C-03(記録・条件付き):五香駅(ごこう、千葉県松戸市・京成松戸線)と同音、方面が遠い。京都の御幸町通(ごこまちどおり)は1モーラ違いで方面が同じ山城(記録)。五更(ごこう、夜の時刻)は低頻度(記録)"
      - "標語は現実の「そうだ 京都、行こう。」のもじり。字幕・看板では元の文字の並びを写さない"
    review: "NG受け入れ可(2026-10-02、docs/reviews/2026-10-02_review_canon_update_4_NG.md)"
    record: "docs/proposals/2026-10-02_kinai_nanakou_omoikaneyama.md §4、docs/proposals/2026-10-02_canon_update_4.md"
    interim_name: "七国府(なこう)。畿内七か国(＋近江・丹波)の案で 2026-10-02 に一時正本入り(Gin「４．OK」、2e57027)、同日 Gin「ごこうにしましょう」で五国府に"
    former_name: "国府内"
    former_name_note: "旧称。下の読み候補(くにうち/こうのうち)は旧称の読みとして記録。決めなくてよい"
    yomi_candidates:
      - yomi: "くにうち"
        verdict: "条件付き採用"
        conditions:
          - "由来メモへ畿内の古訓『内つ国(うちつくに)』典拠を追記"
          - "台本運用でのルビ必須をマスター表備考に明記"
          - "短縮派生禁止2件(下記)の派生予定欄への登録"
        notes: "C-07:『府』が読みに現れない熟字訓型の難読性。C-04:国内(こくない)と字面近接(記録)"
      - yomi: "こうのうち"
        verdict: "代替案(参考)"
        notes: "全字対応で難読性解消。神府(こうぶ)と頭二モーラ重複(記録レベル)"
      - yomi: "くになか"
        verdict: "棄却"
        reason: "C-03:山梨県の実在地方名『国中(くになか)』と衝突"
      - yomi: "こうぶ"
        verdict: "不可"
        reason: "C-08:A006神府(こうぶ)と完全同音(兄弟区分間)。C-03:甲武と完全同音。読み根拠も薄い(実在慣行はこくふ/こう/こくぶ)"
    derived_shortening_bans:
      - "『国府』:不可(国府駅・国府津駅がC-01衝突)"
      - "『府内』:不可(大分市旧称・府内城がC-02/C-03衝突、火守道域内地名と正面衝突)"
      - "派生は常に三字フル形『国府内○○』で行う"
      - "五国府でも「国府」単独への短縮は不可(同じ理由)"
    status: "採用:五国府(ごこう)(Gin「ごこうにしましょう」2026-10-02)"
    open_question: "~~進捗報告中の『七国府』がA000の改名か別エントリかは未確認~~ → 改名。名前は五国府(2026-10-02解消)"
    parent: null
    note_parent_column: "親エントリ欄は架空世界内の依存専用。現実の近畿地方は書かない(現実対応は実名欄)"

