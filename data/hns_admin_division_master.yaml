  - {real: "中津川市", fictional: "央淵河市", yomi: "おふちがわし", parent: "鵜篝県", notes_direction: "名の向き：宿場の名(中津川宿)が先で、市の中を流れる 中津川(川)はあとからその名で呼ばれた見込み(中津川市史 中巻(https://adeac.jp/nakatsugawa-city/texthtml/d100010/mp000010/ht040140、江戸の道中記では川はほぼ「川上川」。川の名は水源の地名から付けるのがふつう)、Wikipedia 中津川市(市名は中山道 中津川宿 から)、2026-10-25 に HNS-M4 が調べた)。岐阜の 中津川(川)を決めるときは 央淵川(川の名は〇〇川で終わる)とし、市の 央淵河 と一字ずれるのは記録で受ける。HNS-M4 の問い「イ（市は 央淵河市、岐阜の川は 央淵川、ずれは記録で受ける）にしてよい、という意味ですか？」にGin「okです」(2026-10-25、HNS-M4 のセッション)。日本で〇〇河 で終わる川は見つけていない(佐賀平野の 佐賀江 など 江湖 の 〇〇江 はある)", rule: "中津川＝央淵河 と同じ字(DIFF-045。川の名は 2026-10-25 に 央淵川 に直したが、市の名の中の 川 は地名の字なので 河 のまま)。中→央(央嶺＝中部 と同じ)、津→淵(楊淵＝柳津 と同じ。淵 の元は 沼・津 で増えない)、川→河。同じ字の地名は一括(DIFF-045):中津川(川)・中津川市・中津市・津南中津中継局", verdict: "採用", ruling: "Gin「どちらもok」→HNS-G5 の案 中湊河(§1)→Gin「央淵河(おぶちがわ)」「はい」→HNS-G5 の照らし(おぶち＝姓 小渕 と同じ音、§3)→Gin「おふちがわ？」→HNS-G5 の照らし(0、§5)→HNS-M4 の問い「央淵河(おふちがわ)・央淵河市・央淵市(おふちし)・天苗央淵(あまなえおふち)、ルビ必須 で登録してよいですか？」にGin「はい」→HNS-M4「二つとも登録してよいという意味ですか？」にGin「ok」(2026-10-24、HNS-M4 のセッション)", notes: "ルビ必須(おふち。話し言葉で ふち が連濁して おぶち＝姓 小渕 と同じ音に崩れうるので、読みを固定する)", record: "docs/proposals/2026-10-24_nakatsugawa_kuroiso.md §3・§5"}
