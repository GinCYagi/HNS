oceans:
  note: "世界の大洋と海の名(2026-10-23 から)。作り方は大陸と同じ(DIFF-052:名が付いた瞬間を一歩ずらす。理はずらさない)。インド洋は国の名が先(保留)。北極海・南極海は方角＋極なので残す。日本海＝日ノ本海 は決まり済み"
  entries:
    - {real: "太平洋(Pacific Ocean。マゼランの Mar Pacífico、江戸時代の終わりの訳)", fictional: "太謐洋", yomi: "たいひつよう", outer_name: "Placid Ocean(Mar Plácido)", rule: "Pacífico(穏やか)→Plácido(穏やか)。日ノ本の訳は 天下太平 の 太＋天下静謐 の 謐。大西洋 と 太・大 で並ぶ", verdict: "採用", ruling: "Gin「イ」「成り立ちからもじれればなと」「静謐も由来はいいんだけどね」→HNS-G5 の案(docs/proposals/2026-10-23_oceans_eurasia_toa.md §3・§6-1、169a6cc)→Gin「1、3は OK、2、4はちょっと考えたいです」(2026-10-23、HNS-G5 のセッション)。登録 HNS-M4", note: "照らし(G5):地名 0、同じ音は 大筆 のみ(weblio)。謐 は常用漢字の外。Placid Ocean という海の名は見つからない。下げた案:静穏洋・静謐洋・太寧洋"}
    - {real: "大西洋(Atlantic Ocean。マテオ・リッチ『坤輿万国全図』1602 の漢語の名)", fictional: "大西洋", yomi: "たいせいよう", outer_name: "Telamonic Ocean", rule: "日ノ本の名は残す(大＋西＋洋 は方角と理の言葉だけ、DIFF-026・DIFF-052)。外の名は Atlantic(アトラス)→男像柱 atlantes の別名 telamones から Telamonic", verdict: "採用", ruling: "HNS-G5 の案(docs/proposals/2026-10-23_oceans_eurasia_toa.md §3・§6-1、169a6cc)→Gin「1、3は OK、2、4はちょっと考えたいです」(2026-10-23、HNS-G5 のセッション)。登録 HNS-M4", note: "Telamonic Ocean という海の名は見つからない(G5、Web)。Telamon はギリシャ神話の英雄の名でもある"}
    - {real: "北極海・南極海", fictional: "北極海・南極海", rule: "方角＋極なので替えない", verdict: "採用", ruling: "大陸の 南極・北極 と同じ(Gin「はい」2026-10-23、continents)"}
    - {real: "オホーツク海(Sea of Okhotsk。港町 Okhotsk から、その元は Okhota 川。Okhota はエヴェン語 okat〈川〉がなまったもの。日本語の名はロシア語の音を写したもの)", fictional: "ビラーツク海", yomi: "びらーつくかい", outer_name: "Sea of Biratsk", rule: "外の名を替える(DIFF-052)。okat(川)→満洲語・女真語 bira(川)。川 Bira→港 Biratsk→海。日ノ本の名はロシア語の音を写す(現実と同じ)", verdict: "採用", ruling: "HNS-G5 の案(docs/proposals/2026-10-23_oceans_eurasia_toa.md)→HNS-M4 の問い「ア ビラーツク海／イ 替えない」にGin「アかな」→M4 の照らしのあと「決めてよければ、正本の oceans の節に ビラーツク海 を入れます」にGin「はい」(2026-10-23、HNS-M4 のセッション)", note: "記録:Bira は現実のロシアの川の名(ユダヤ自治州、ビロビジャンの名の元、英語版 Wikipedia「Bira (river)」)と重なる。海の名 ビラーツク・Biratsk は Web 検索で見つからない(M4、2026-10-23)。近い名 Birsk(バシコルトスタン)・Bratsk(イルクーツク州)・Biratnagar(ネパール)。日本語の ビラ(配る紙)と頭の二音が同じ。weblio はつながらず引けていない"}
char_defaults:
  note: "一字の置き換え表(字ごとの既定の行き先)。町名などで名前ごとの事情がないときに使う下書きの道具で、承認済みの名前は動かさない(Gin「両承認」2026-10-11)。表の案 docs/proposals/2026-10-10_char_defaults.md(HNS-G5)、査読 HNS-C5。Gin が採った行から順に入れる。方針:承認済みの名前に表を合わせる、既定の読みの重なりは替える、1拍のずれは許す(2拍以上は避ける)、難しい字は簡単な字に、二つの字を同じ行き先にしない。組はすべて入れ替え(相互)にし、これから足す組もはじめから相互で作る。機械で替えるのは下書きまで:現実との重複は道具で拾い(郵便番号データ・住所・記事)、重なった名だけ名前ごとに考える。意味の崩れは替える前に単語の表で言葉ごと止める(高原・河岸 など)、漏れたものは照らしの段で HNS-G5・HNS-C5 が見て足す(DIFF-050 の改め、Gin「b,ok」2026-10-23)。次点(next)は、既定の行き先が現実の名と重なったときにまず試す字。越→渡 は国の名を作るための替え字で、字の表の組ではない。逆の 渡→越 は使わない(町名 渡前 が旧国名 越前 に戻るため、DIFF-051)。現実の地名の 渡 は 渉 などの別の字に替える(字の表の 渡→渉、次点 済、一方通行)。船⇄舟 は字の表に入れない(HNS-G5 の案に HNS-C5 賛成、Gin「Cは入れなくて良いと思う」2026-10-24)。船・舟 の付く名は名前ごとに同意異字で決める(M4「この組だけは相互にしない、と記録しておきます」にGin「はい」2026-10-23)"
  entries:
    - {real: "田", fictional: "苗", yomi: "なえ", verdict: "採用", ruling: "HNS-G5の案(docs/proposals/2026-10-10_char_defaults.md §4.2〜§4.8)→HNS-C5査読(docs/reviews/2026-10-21_review_tada_no_C5.md)→Gin「採決」(HNS-G5 のセッション)→Gin「全採決」(2026-10-21、HNS-M4 のセッション)", notes: "案エ。田と苗を互いに入れ替える(一対一、Gin「変換は一対一、もしくは単語分割とか一意になるように調整したい」「苗が入ってるから相互なら〇田〇だよね」)。前例 田村市＝苗邑市"}
    - {real: "苗", fictional: "田", yomi: "た", verdict: "採用", ruling: "HNS-G5の案(docs/proposals/2026-10-10_char_defaults.md §4.2〜§4.8)→HNS-C5査読(docs/reviews/2026-10-21_review_tada_no_C5.md)→Gin「採決」(HNS-G5 のセッション)→Gin「全採決」(2026-10-21、HNS-M4 のセッション)", notes: "案エ。田→苗 の裏返し(猪苗代→猪田坪)"}
    - {real: "野", fictional: "原", yomi: "はら", verdict: "採用", ruling: "HNS-G5の案(docs/proposals/2026-10-10_char_defaults.md §4.2〜§4.8)→HNS-C5査読(docs/reviews/2026-10-21_review_tada_no_C5.md)→Gin「採決」(HNS-G5 のセッション)→Gin「全採決」(2026-10-21、HNS-M4 のセッション)", notes: "正本の型(聳原・微原ほか)。相互(野⇄原、DIFF-050 の改め、Gin「b,ok」2026-10-23)。次点 平(既定で替えた名が現実の名と重なったら、まず次点で試す)", next: "平"}
    - {real: "原", fictional: "野", yomi: "の", next: "平", verdict: "採用", ruling: "HNS-G5 の案にGin「ok」「はい」(HNS-G5 のセッション)→HNS-C5 査読 受け入れ可(docs/reviews/2026-10-23_review_no_hara_swap_C5.md)→HNS-M4 の問い「B　G5 のセッションで Gin が答えたもの、登録してよいですか？」にGin「b,ok」(2026-10-23、HNS-M4 のセッション)", notes: "野→原 の裏返し(野⇄原、田⇄苗 と同じ)。次点 平 は 野 の次点と同じなので、平 を使った名には元の字(野 か 原 か)を記録する(HNS-C5)。前例 原町→駆野町", record: "docs/proposals/2026-10-23_no_hara_swap.md、docs/reviews/2026-10-23_review_no_hara_swap_C5.md"}
    - {real: "代", fictional: "坪", yomi: "つぼ", verdict: "採用", ruling: "HNS-G5の案(docs/proposals/2026-10-10_char_defaults.md §4.2〜§4.8)→HNS-C5査読(docs/reviews/2026-10-21_review_tada_no_C5.md)→Gin「採決」(HNS-G5 のセッション)→Gin「全採決」(2026-10-21、HNS-M4 のセッション)", notes: "代(人が区切って整えた田の一区画)は理(DIFF-028)ではない(HNS-M4 の見立て、Gin「1」)。区切った土地の 坪。次点 畝。相互(代⇄坪、2026-10-23)"}
