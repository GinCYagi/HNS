      - "C-03(記録・条件付き):五香駅(ごこう、千葉県松戸市・京成松戸線)と同音、方面が遠い。京都の御幸町通(ごこまちどおり)は1モーラ違いで方面が同じ山城(記録)。五更(ごこう、夜の時刻)は低頻度(記録)"
