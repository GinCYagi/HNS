  - {real: "黒潮町(高知県幡多郡。2006-03-20 に大方町・佐賀町が合わさってできた)", fictional: "黒潮町", yomi: "くろしおちょう", parent: "建依県", rule: "名は海流の 黒潮 から(合併協議会の理由「両町とも太平洋に面しており、黒潮の恵みを受けている町だから」、四万十町地名辞典「黒潮町」、HNS-G5 の調べ docs/proposals/2026-10-24_kotowari_flow.md §8)。黒潮 は現象の名で単語の表で止める(DIFF-028 の追記)ので、町の名もそのまま", verdict: "採用", ruling: "Gin「黒潮、親潮っていうその海流の流れのことを指しているのであれば、これは理じゃないかな」(HNS-G5 のセッション)→HNS-G5・HNS-C5 の見立て(案 ウ)→HNS-M4 の問い「黒潮 は残し、黒潮町 は黒潮町のまま」にGin「3,ok」(2026-10-24、HNS-M4 のセッション)", notes: "作中に現実と同じ字・読みの町の名が残る(理の言葉なので、北極・南極 と同じ)。外した案:墨塩町(黒⇄墨・塩⇄潮 の機械どおり、名の元が海流と確かめられたので外す)。津波の想定の大きい土地(C5):字を替えないので、新しい字の受け取られ方の心配はない。町の中の町域(入野・浮鞭 ほか)はそれぞれの字で別に見る。協議会の資料そのものは見ていない(G5)", record: "docs/proposals/2026-10-24_kotowari_flow.md §8、docs/proposals/2026-10-24_shore_chars.md §9-5"}
