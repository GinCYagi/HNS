    real: "畿内"
    fictional: "五国府"
    yomi: "ごこう"
    scope: "畿内は五か国のまま:大和・山城・摂津・河内・和泉(五つの国の国府を抱えるので五国府)。五畿七道と合う"
    ruling: "Gin「３、そうだ、ごこう、いこう」「でもきれいだと思うんだけど＋２なった原因ってなんだっけ」「後光、信仰の地だからと理由づけられなくもない」「ごこうにしましょう」(2026-10-02、HNS-E5経由)"
    origin_memo: "五つの国の国府を抱えるので五国府。後光と同音、信仰の地の掛詞(Gin)。御幸(ごこう、上皇のお出かけ)とも重なる二つ目の掛詞(NG、害なし)"
    conditions_2026_10:
      - "C-07:「ごこくふ」と読まれやすい。台本はルビ必須。「五国」と略さない(読みが変わる)"
      - "C-03(記録・条件付き):五香駅(ごこう、千葉県松戸市・京成松戸線)と同音、方面が遠い。京都の御幸町通(ごこまちどおり)は1モーラ違いで方面が同じ山城(記録)。五更(ごこう、夜の時刻)は低頻度(記録)"
      - "標語は現実の「そうだ 京都、行こう。」のもじり。字幕・看板では元の文字の並びを写さない"
    review: "NG受け入れ可(2026-10-02、docs/reviews/2026-10-02_review_canon_update_4_NG.md)"
    record: "docs/proposals/2026-10-02_kinai_nanakou_omoikaneyama.md §4、docs/proposals/2026-10-02_canon_update_4.md"
    interim_name: "七国府(なこう)。畿内七か国(＋近江・丹波)の案で 2026-10-02 に一時正本入り(Gin「４．OK」、2e57027)、同日 Gin「ごこうにしましょう」で五国府に"
