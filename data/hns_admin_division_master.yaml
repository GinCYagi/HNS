  prefectures:
    - {real: "沖縄県", fictional: "阿児奈波県", yomi: "あこなわけん", parent: "(七道の外。現実の五畿七道にも入っていなかった)", rule: "G-01・DIFF-021(日本の文献に残るこの島のいちばん古い名、今は地名として使われていない)", verdict: "採用", ruling: "Gin「次に大きな括りなのは何が在る？」「１から行きましょう」→「琉球地方、はまた括りが違うの？」「ややこしや」→(HNS-Rev:現実の沖縄県と同じ範囲)→「あこなわにしますか」(2026-10-03)", origin_memo: "753年、鑑真の一行が「阿児奈波」に着いた(779年『唐大和上東征伝』「同到阿児奈波」)。日本の文献に残るこの島のいちばん古い名。あくまでも史実の経緯(文献の記録)からいただいた名前で、土地の人の自称だとは言い切らない(Gin「あくまでも経緯からいただいたということで」2026-10-03)。Wikipedia「琉球王国」は「島民がここは何処かとの問いに阿児奈波と答えた」「住民が自国をうちなーのように呼んでいた」と書くが、「沖縄県」の注は「原文も単に『同到阿児奈波』としているだけ」(記事どうしで食い違い、一つの記事の見方として記録)", notes: "範囲は現実の沖縄県と同じ(奄美は鹿児島県＝火守道の中のまま)。読みは「あこなわ」に一本化(あこなはとも読まれてきた。おきなわの音に近い方)。ルビ必須。記録:阿鬼奈波の誤写説(近藤守重・吉田東伍)、阿＝おの説(石井望)。字の頭「阿児」は三重県志摩市阿児町(あご)と同じ。ニライカナイ(信仰の語)・琉球(今も使う、流求は蔑称の説)・ウチナー(今の自称)は外した", review: "NG条件付き(2026-10-03、docs/reviews/2026-10-03_review_okinawa_NG.md)", record: "docs/proposals/2026-10-03_okinawa_candidates.md", pre_publication_review: "公開前に沖縄にゆかりのある人の目を通すのは努力目標(できるときに通す、通せないことで公開を止めない)。札幌・長巡川とそろえる。HNS-M4 の問いに Gin「1、はい」(2026-10-11)。前は「目を通す決まりは残す」"}
