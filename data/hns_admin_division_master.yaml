  - {real: "長野市", fictional: "悠原市", yomi: "ゆうはらし", parent: "悠原県", rule: "DIFF-030(県と同じ名)。悠原 は長野村(今の大字長野)の地形から(長→悠、野→原)。現実と同じく、県の名は市の側(長野村)から来た(RUL-014 の型)", verdict: "採用", ruling: "Gin「長野市候補」→HNS-G5 の案 ア 科坂市(DIFF-030)／イ 長野村の由来から→Gin「その由来を考慮した候補は出せる？」→悠原市→Gin「ワシは提案があったときから変わるもんだと」「それなら科坂の国悠原県悠原市でもいい気もするけどね」→Gin「もう作れって事なんじゃないかと」「旧律令国名」(DIFF-051)→越後に柳を使わない B にGin「b」、悠原県 を RUL-014 の型に広げるにGin「ok」→Gin「その辺のながれを本来の糸に戻す試みです」「柳都とりゅうとを変えずに」→渡 を ど にそろえる(Gin「どぜん、どちゅう どご」「ばんどさいせん ばんどとうせん」「頼んでokです」)→上野＝上叢・上越線＝叢渡線 にGin「イかな」「ok」→上越市＝上ノ渡市 にGin「アで」→HNS-M4 のまとめの問い「登録してよいですか？」にGin「1,ok 2,ou」→M4「2 は ok の打ち間違いで、表の登録も含むか」にGin「ok」(2026-10-23、HNS-M4 のセッション。HNS-G5 の案・HNS-C5 の査読)", notes: "C-07:ルビ(ゆうはら。連濁の ゆうばら は 夕張 と一音違い)。善光寺 の日ノ本の名はまだない", record: "docs/proposals/2026-10-23_nagano_city.md、docs/reviews/2026-10-23_review_nagano_city_C5.md"}
