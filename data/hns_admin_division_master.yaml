# -------------------------------------------------------------
# 行政区分エントリ
# -------------------------------------------------------------
admin_divisions:
  - id: A000
    real: "畿内"
    fictional: "国府内"
    yomi_candidates:
      - yomi: "くにうち"
        verdict: "条件付き採用"
        conditions:
          - "由来メモへ畿内の古訓『内つ国(うちつくに)』典拠を追記"
          - "台本運用でのルビ必須をマスター表備考に明記"
          - "短縮派生禁止2件(下記)の派生予定欄への登録"
        notes: "C-07:『府』が読みに現れない熟字訓型の難読性。C-04:国内(こくない)と字面近接(記録)"
      - yomi: "こうのうち"
        verdict: "代替案(参考)"
        notes: "全字対応で難読性解消。神府(こうぶ)と頭二モーラ重複(記録レベル)"
      - yomi: "くになか"
        verdict: "棄却"
        reason: "C-03:山梨県の実在地方名『国中(くになか)』と衝突"
      - yomi: "こうぶ"
        verdict: "不可"
        reason: "C-08:A006神府(こうぶ)と完全同音(兄弟区分間)。C-03:甲武と完全同音。読み根拠も薄い(実在慣行はこくふ/こう/こくぶ)"
    derived_shortening_bans:
      - "『国府』:不可(国府駅・国府津駅がC-01衝突)"
      - "『府内』:不可(大分市旧称・府内城がC-02/C-03衝突、火守道域内地名と正面衝突)"
      - "派生は常に三字フル形『国府内○○』で行う"
    status: "Gin裁定待ち(くにうち/こうのうちの二択)"
    open_question: "進捗報告中の『七国府』がA000の改名か別エントリかは未確認(構想段階・未査読)"
    parent: null
    note_parent_column: "親エントリ欄は架空世界内の依存専用。現実の近畿地方は書かない(現実対応は実名欄)"

  - id: A001
    real: "大和"
    fictional: "広貴"
    yomi: "ひらぎ"
    category: "畿内"
    rule: "G-07(+G-07b相当・正式化待ち)"
    parent: "A000(登録待ち)"
    verdict: "条件付き採用"
    conditions:
      - "『貴』過負荷の解消(A005と同字・同諺置換)"
      - "G-07bの正式化"
    c_checks: "C-03:柊(ひいらぎ)近接・平木(ひらき)姓同音域=記録対応"
    rejected_predecessor:
      name: "小貴(おぎ)"
      reason: "C-06:最高格の国への『小』は格降格。広貴への差替は正しい自己修正(査読辞書へ経緯記録)"
    origin_memo: "同諺内漢字置換(和を以て貴しとなす)+同意異語"

  - id: A002
    real: "山城"
    fictional: "谷背"
    yomi: "やぜ"
    category: "畿内"
    rule: "G-07"
    verdict: "要修正"
    reasons:
      - "自己矛盾:G-05備考『地形反転は禁止』と由来メモ『山→谷(対照地形)置換』が衝突。同カテゴリ内置換への修正か規則改定(差分手続き)の二択"
      - "C-03:八瀬(やせ)が京都(同一地域)に実在。濁音一つ違いは音声作品で最危険型"
    origin_memo: "山城国の旧称『山背』を典拠(この筋自体は良)"

  - id: A003
    real: "摂津"
    fictional: null
    status: "未提出"

  - id: A004
    real: "河内"
    fictional: "洲外"
    yomi: "すげ"
    category: "畿内"
    verdict: "要修正(読みのみ)"
    reasons:
      - "C-04:『すげ』は菅(一般名詞・頻出姓)と同音、口語『すげー』と重なり『すげのくに』は誤誘発"
    notes: "内→外の反転は格を含意せず可。洲への置換はG-05水系内で正当。字は維持し読み替え(すと・しゅうげ等)検討余地"
    origin_memo: "河口の中洲の洲+対義語の外"

  - id: A005
    real: "和泉"
    fictional: "貴川"
    yomi: "きかわ"
    category: "畿内"
    rule: "G-07, G-05"
    verdict: "要修正"
    reasons:
      - "C-03:紀の川市(きのかわ)が実在かつ和泉国隣接地域。音声弁別困難・方面同一"
      - "C-03:大阪市淀川区・木川(きかわ)と完全同音"
      - "同字過負荷:A001広貴と同諺置換で『貴』重複(畿内兄弟間)"
    origin_memo: "『和を以て貴しとなす』典拠で和→貴、泉→川(水系内置換)"

  - id: A006
    real: "山陰道"
    fictional: "神府道"
    yomi: "こうぶのみち"
    category: "五畿七道"
    rule: "G-07"
    verdict: "条件付き採用"
    conditions:
      - "短縮派生は再査読必須(HR神府=甲府こうふと衝突)。実質、常に『道』を含むフル形で派生"
      - "対名称:山陽道の候補と同時確定(片側確定は不可)"
    world_note: "短縮棄却→『常に正式名称で呼ばれる文化』として世界設定へ還元可能(P-05)"
    origin_memo: "出雲・神在月。『神々の府(みやこ)』が歴史的に定着した設定。宗教史上の違和感なし(神符は『しんぷ』読みで非衝突)"

  - id: A007
    real: "西海道(本世界の旧称)"
    fictional: "火守道"
    yomi: "ひもりのみち"
    category: "五畿七道"
    rule: "G-07(判例第一号)"
    verdict: "採用(Gin裁定・B案)"
    ruling_date: "2026-07-07"
    history_setting: >-
      (b)案採用:本世界では当初『西海道』の呼称が存在したが、火山災害と
      鎮火信仰・祈祷文化の定着を経て『火守道』が正式な行政区分名となった。
      改称時期は未確定(世界史・年表整備時に裁定)。
    cascade_updates:
      - "九州相当行政区分:西海道→火守道"
      - "HR西海道→HR火守(D-03判例:短縮可)"
      - "西海道を親とする派生名称・派生元エントリの更新"
    c_checks: "『ひもり』(火守り)は一般名詞だが低頻度=記録対応"
    note: "変更影響ランク初の実地適用事例。由来メモの免責記述(着想と断定の区別)はG-07の模範"

  - id: A008
    real: "九州"
    status: "A007裁定により実質確定(火守道)。エントリ統合の整理が必要"

