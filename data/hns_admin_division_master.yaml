    - {real: "西会津縄沢", fictional: "西相津索澪", yomi: "にしあいづさくみお", ch: 46, prev: "西相津綱淵(にしあいづつなぶち、2026-10-20〜10-24。綱 は元の古い書き方〈文禄の蒲生領高目録の 綱沢〉で、つな の音も元のまま、と Gin が見つけて直した)←西相津綱渓(にしあいづつなたに、2026-10-21 のうちに直した)", rule: "縄→索(なわ・つな、索道の索。綱 は元の古い書き方なので避ける)、沢→澪(米沢市＝穂澪市 と同じ。淵 は 沼 だけを元にする、docs/proposals/2026-10-24_water_chars.md)。前の rule:縄→綱、沢→淵(Gin の直し、局名の後ろを読める四つの音に、Gin「四字で読めるようにしたい」)。照合(G5 §1.11)0。電波データの局名は 西会津綱沢、所在地は縄沢南方高地。2000年廃局。元の読み:縄沢＝つなざわ(縄沢村 つなざわむら、今の西会津町睦合。文禄三年〈1594〉の蒲生領高目録では「綱沢」と書く。平凡社『日本歴史地名大系』、コトバンク「縄沢村」、Gin が見つけた 2026-10-24)。綱 は元の古い書き方の字で、つな の音も元のまま残る(DIFF-043 は「なるべく当てない」の側)", verdict: "採用", ruling: "Gin「直しましょう」→HNS-G5の案(docs/proposals/2026-10-24_water_chars.md §6、照らし 0)→HNS-M4の問い「縄沢 ＝ 西相津索澪(にしあいづさくみお)でよいですか？」にGin「2,ok」(2026-10-24、HNS-M4 のセッション)。前の裁定:HNS-G5の候補(docs/proposals/2026-10-20_ftv_relays_phone_prefix.md 第1部)→HNS-C5査読 9局とも受け入れ可(docs/reviews/2026-10-20_review_ftv_relays_phone_prefix_C5.md)→HNS-M4の問い「1. FTV の中継局9つを、この名で採るか。新地＝手長(たなが)、いわき湯の岳＝磐浜温水岳(いわはまぬくみだけ)も含みます 2. 玉川村を珠沢村(たまさわむら)にするか 3. 田→圃・野→原(扉原は例外)とするか」にGin「3 検討」「ほかはさいよう」(2026-10-21、HNS-M4 のセッション)", record: "docs/proposals/2026-10-20_ftv_relays_phone_prefix.md 第1部"}
