national_codes:
  note: "日ノ本の国の名と符号(2026-10-23 から)。国の名の筋は DIFF-052(名が付いた瞬間を一歩ずらす)。Hapan の時期は史実に合わせる(Hapan の行)。まだ:漢字の国での呼び名(要るときに、Gin「6,ok」)"
  entries:
    - {real: "JP(ISO 3166-1 alpha-2)", fictional: "HI", rule: "ひのもと の頭 Hi(Hi-フォン と同じ取り方)", verdict: "採用", ruling: "HNS-G5 の案(docs/proposals/2026-10-22_country_codes.md、HO か HI)→Gin「日ノ本 ひのもと／HI／HIだね」(2026-10-23、HNS-G5 のセッション)", note: "照らし(M4、Web 2026-10-23):ISO 3166-1 alpha-2 で HI は割り当てなし(Wikipedia の一覧で unassigned)、IANA の TLD 一覧(Version 2026102200)に .hi はない。記録:アメリカのハワイ州の略号と同じ字"}
    - {real: ".jp(国別のトップレベルドメイン)", fictional: ".hnmt", rule: "HiNoMoTo の子音", verdict: "採用", ruling: "Gin「最後「」……HP\"bsr.jp\"まで。」→bsr.jp は実在の他人のサイトだったので→Gin「hnmtにしましょう」(2026-10-09、ALM のセッション、ALM docs/bonus_stage_dance_storyboard.md に記録)", note: "照らし(M4、2026-10-23):IANA の TLD 一覧(Version 2026102200)に .hnmt はない。使用例:bsr.hnmt(BSR 開局 75 周年の縦長動画の QR)"}
    - {real: "日本(にほん・にっぽん。字は一通り、読みが二通り、2009-06-30 閣議決定でどちらか一方に決めていない)", fictional: "日ノ本／火ノ本", yomi: "ひのもと", rule: "現実の裏返し:読みは一通り、字が二通り(日ノ本＝都の側、火ノ本＝火守道〈九州〉の側の書き方、火山と鎮火信仰の土地から見た国の名)。どちらか一方に決めていない", verdict: "採用", ruling: "Gin「火守が出てきてるから火ノ本があったというifはどうかな」「これで収束するか試してみて」→HNS-G5 の試し(docs/proposals/2026-10-23_country_name_model.md)→Gin「2,ok」(HNS-G5 のセッション)→M4 の問い(国の名の筋・符号・航空会社をまとめて登録してよいか)に Gin「のこりも、ok」(2026-10-23、HNS-M4 のセッション)", history: "607 国書「火燃處天子、書を火盡處天子に致す」(ずらしはここ一か所。火盡處 は法華経 序品「如薪盡火滅」を踏まえた、仏教を重んじる菩薩天子への礼のつもりの言葉。煬帝が怒ったのは現実と同じく「天子」の語)→686 難波宮の全焼(「全焼」の一語だけ)と阿蘇の火(隋書)が重なり、火 の字を国の名から退けて 日 に改める(読みは ひのもと のまま)。同じ年に元号 朱鳥。作中の読み:朱雀が火を司るからこそ、火を治めて欲しいとの祈り(Gin)→701 大宝律令で 日ノ本 が定まる→702 遣唐使が唐に 日ノ本 と名乗る。都の書き物は 686 から 日ノ本(984 奝然の献上も現実どおり)→火守道(九州)は火を鎮め守る土地なので 火ノ本 を書き続ける→11〜13世紀 博多の商いの書き物・船の印の 火本 が泉州の話し言葉で hér-pún と呼ばれ、マレー語 Hepang→ポルトガル語 Hapão→英語 1577 Hapan。マルコ・ポーロの Fopangu の fo は 火 の北の読みで、現実の Cipangu と同じく閩南語とは別の筋", history_real: "現実の手がかり:隋書 巻81(国書・阿蘇山・使いの言葉「聞海西菩薩天子重興佛法」)、大智度論「日出処是東方 日没処是西方」(東野治之の説、ja.wikipedia「遣隋使」)、日本書紀(難波宮の全焼 686 正月)、朱鳥の改元 686-07(理由は明記されていない、天皇の病の平癒の祈りと思われる、ja.wikipedia「朱鳥」)、天武天皇は「日本を国号とした最初の天皇とも言われる」(ja.wikipedia「天武天皇」)、博多綱首(承天寺 1242、コトバンク)、泉州＝Zaiton(en.wikipedia「Quanzhou」)、Wiktionary「火」(泉州 hér)。書かないこと:字の理由に天皇の病・死、684 年、噴火・地震の元号の名", history_ruling: "Gin「日出処の天子／火燃処の天子」「火伏せの考え方から／火山災害が続いたとかで」→M4 の案(はじめから二つの道)に Gin「4,ok」→Gin「重なったから祈祷の意味で変えた、となるのが自然かなと」「礼を尽くしたつもりがちがうところ「天子」で激怒された、なら／ウの火で揃えても問題ない気がします」「両方それで合ってます」「あの頃元号がコロコロ変わってるのはそんな意味合いが強く見受けられたので」→「1,ok」(686 と 701 に分ける)→「朱雀が火を司るからこそ、火を治めて欲しいとの祈り」「2,ok」(2026-10-23、HNS-M4 のセッション)。案と査読:docs/proposals/2026-10-23_hinomoto_hi_kanji.md §9〜§11(HNS-G5、61daf1f)、docs/reviews/2026-10-23_review_hinomoto_hi_kanji_C5.md 追記1〜3(HNS-C5、d9bf880)"}
    - {real: "ジパング(Cipangu、マルコ・ポーロ。日本国 から)", fictional: "フォパング(Fopangu)", rule: "火本国(火ノ本 の ノを落とした 火本＋国)を南の中国の港で読んだ形(火＝閩南語 hé／hóe、Wiktionary)。言い伝えの言葉では「黄金原(こがねばら)のフォパング」", verdict: "採用", ruling: "Gin「黄金の原(黄金原)にするとどう変わる？」「こがねばら」「火本国だと？」「それで整うか見てみて」→HNS-G5 の試し(docs/proposals/2026-10-23_country_name_model.md) §4・§5→M4 の問い(国の名の筋・符号・航空会社をまとめて登録してよいか)に Gin「のこりも、ok」(2026-10-23、HNS-M4 のセッション)", note: "照らし(G5):Fopangu の同じ名は見つからない。香港の地名 Fo Pang(火棚)と字の並びが近い。黄金原 は秋田県湯沢市の町域(こがねはら)と字が重なるが、読みは こがねばら で、外国の本の中の呼び名として扱う"}
    - {real: "Japan(英語、ポルトガル語 Japão から。昔から今まで外国での名)", fictional: "Hapan", rule: "閩南語 hé-pún→マレー語 Hepang→ポルトガル語 Hapão→英語 Hapan(現実の Ji̍t-pún→Jepang→Japão→Japan と同じ道筋)。昔の英語の名で、今も外国での名(現実の Japan の位置)", verdict: "採用", ruling: "Gin「Haponに統一して齟齬が出ないか確認」→G5 の照らし→Gin「Hapanか」→Gin「これ決まればHapan Airlinesとか一気に決まるから」→HNS-G5 の試し(docs/proposals/2026-10-23_country_name_model.md) §6・§7→M4 の問い(国の名の筋・符号・航空会社をまとめて登録してよいか)に Gin「のこりも、ok」(2026-10-23、HNS-M4 のセッション)", time_ruling: "Gin「その外での呼び名と中で使い始めた時期に関しても史実に合わせたいと思います」(2026-10-23、HNS-G5 のセッション、提案書 §9-1)。外:現実の Giapan と同じく 1577年に英語で初めて記録されたことにする(英語版 Wikipedia「Names of Japan」)。中:日ノ本の人が Hapan を使いはじめた時期は、現実の日本人が Japan を使いはじめた時期に合わせる(具体の年は調べていない)", note: "Hapon にしない:タガログ語 Hapón が現実の日本そのもの(Wiktionary「Hapon」、DIFF-051)。Hapan は一字違いとして記録。Türkiye 型の改名(§1 ⑥)は取りやめ"}
    - {real: "Nippon(自分たちの名をローマ字で書く形。Nippon Steel・All Nippon Airways・NHK など)", fictional: "Hinomoto", rule: "現実の Japan と Nippon の二通りと同じく、外国での名 Hapan と自分たちの名 Hinomoto の二通り", verdict: "採用", ruling: "HNS-G5 の試し(docs/proposals/2026-10-23_country_name_model.md) §7→M4 の問い(国の名の筋・符号・航空会社をまとめて登録してよいか)に Gin「のこりも、ok」(2026-10-23、HNS-M4 のセッション)", note: "正本の英語の名に Hinomoto を使う会社(HR・HHS・HF・HOTATE ほか 12 か所)は Nippon 型の名として読める"}
    - {real: "JPN(ISO 3166-1 alpha-3)", fictional: "HAP", rule: "Hapan の頭3文字(FRA・ITA と同じ取り方)", verdict: "採用", ruling: "Gin「HAP だと？」→HNS-G5 の試し(docs/proposals/2026-10-23_country_name_model.md) §7→M4 の問い(国の名の筋・符号・航空会社をまとめて登録してよいか)に Gin「のこりも、ok」(2026-10-23、HNS-M4 のセッション)", note: "照らし(G5):ISO 3166-1 alpha-3 に割り当てなし。別の仕組みで重なり:IATA の空港の符号 HAP(オーストラリア・クイーンズランド州)、ICAO の航空会社の符号 HAP(メキシコ Helicopteros Aero Personal)。外した案 HNM・HPN"}
continents:
