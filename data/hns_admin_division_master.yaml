  - {real: "名古屋市", fictional: "金之鯱市", yomi: "かねごし", parent: "鮎潟県", rule: "DIFF-018(縮め読み:金之鯱を字のとおりに かねのこ〈鯱＝こ は金鯱賞 きんこしょう の読みから〉→話しことばで の が ん に縮んで かねんこ→ん と こ がまとまって濁り かねご〈Gin「ん+こ=ご」〉、市を付けて かねごし。Gin「かねご／し」で確かめた)", verdict: "採用", ruling: "Gin の案(金鯱市→金ノ鯱→…→壱地鯱→かねごし、2026-10-21、HNS-G5 のセッション)→G5の問い「名古屋は 金之鯱市(かねごし)に決めてよいですか」にGin「はい」→HNS-C5「受け入れ可(条件つき、ルビ必須)」→HNS-M4「次の3つを、まとめて正本に登録してよいですか？ 愛知県→鮎潟県(あゆがたけん)、名古屋市→金之鯱市(かねごし、ルビ必須、尾張府蓬左市から替える)、電話の頭→DAYG」にGin「はい」(2026-10-21、HNS-M4 のセッション)", origin_memo: "名古屋城の金の鯱", notes: "ルビ必須。読みのわけ(縮み方の道すじ)を残す。名の部分 かねご は3拍(元の なごや と同じ長さ)。元と同じ音は ご(Gin「ちょっとは糸がもつれても良いでしょう」)。県と市は別の名(埼玉県さいたま市の型)。前の名 尾張府蓬左市(おわりふ ほうさし、採用だった)は替えた:蓬左は名古屋市蓬左文庫で今も使われる(DIFF-021)、尾張は尾張旭市がある(DIFF-019)。そのまた前の 駄賀屋 は C-05(『駄』の侮蔑的含意)で棄却。外した案:壱地鯱市(いちこし)・鯱市(しゃち)・称古敷市(こしき)・号称古邸市・太閤市。照合(G5):かねご は町域・市町村・住所・記事 0、字の 金之鯱 も 0", review: "HNS-C5 受け入れ可(条件つき、ルビ必須・縮め読みの道すじを記録)", record: "docs/proposals/2026-10-21_aichi_nagoya.md(査読 docs/reviews/2026-10-21_review_aichi_nagoya_C5.md) §7"}
  - {real: "豊田市", fictional: "饒苗市", yomi: "にぎなえし", parent: "鮎潟県", rule: "現実と同じ形(もと挙母市、1959-01 会社の名を取って改めた)。日ノ本でも 挙母市→饒苗市。挙母 の日ノ本名は旧名として要るときに作る", verdict: "採用", ruling: "HNS-G5 の案(docs/proposals/2026-10-22_toyota_nissan_vodafone.md)→HNS-M4 の問い「1. トヨタ＝ニギナエ（饒苗、饒苗市）を採るか。創業家の姓 豊田 も 饒苗 に替えるか。」にGin「1,ok」(2026-10-22、HNS-M4 のセッション)"}
  - {real: "尾張旭市", fictional: "殿伸朝暉市", yomi: "とのびあさひし", parent: "鮎潟県", rule: "RUL-023②(旧国名の部分を日ノ本名に:尾張＝殿伸)＋DIFF-028(旭＝朝の日は理の言葉。読みを残して字だけ替える、朝日→朝暉 の前例)", verdict: "採用", ruling: "HNS-G5の候補 尾展(びてん)・尾伸(びしん)(docs/proposals/2026-10-21_owari_mikawa.md)→Gin「尾伸市(おのびし)」「尾伸旭市?」「理には入らない？ 太陽」「じゃあ尾伸日市？読めないけど」「おのびからけんとう」→HNS-G5の検討(§9)・HNS-C5査読→Gin「殿伸(とのび)」「尾=殿 から」→HNS-G5の照合(§12)→Gin「天下は取ったわけだし」→HNS-C5査読 受け入れ可・推し(追記 7)→HNS-M4の問い「尾張：殿伸(とのび)を採用しますか？ 尾張旭市を 殿伸朝暉市(とのびあさひし)とするところまで含みます」にGin「1採用」(2026-10-21、HNS-M4 のセッション)。HNS-M4の読み取り:1＝問いの一つめ(尾張、尾張旭市を含む)。違えば直す", notes: "7拍(元の おわりあさひ と同じ6拍に し)。朝暉 の字は柳都の朝暉中継局と二か所(組の名なので紛れは小さい、G5)。外した案:尾伸朝陽市(朝陽 の字は坂井市丸岡町朝陽・常滑市大谷朝陽ケ丘にある)・尾伸日市(Gin「読めないけど」)・尾伸旭市(旭が残る)", review: "HNS-C5 受け入れ可", record: "docs/proposals/2026-10-21_owari_mikawa.md §9.3・§12"}
  - {real: "大阪市", fictional: "千橋市", yomi: "ちはしし", parent: "千橋府", rule: "DIFF-030(府と市が同じ名前、現実の大阪府大阪市の形)", verdict: "採用", ruling: "HNS-G5の問い「近畿の残り4つをまとめて採る、でよいか」にGin「読みやすいしいいと思います」「全採用」(2026-10-06、HNS-G5のセッション)", notes: "前の大波(おおなみ)・小波(このは)は棄却のまま"}
