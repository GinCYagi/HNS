    - {real: "青森県", fictional: "碧林県", yomi: "へきりんけん", parent: "陸奥(地方)", rule: "DIFF-016(青→碧、森→林)", verdict: "採用", ruling: "Gin「ここまでのものを採択、次に行きます」(2026-10-03、HNS-NGのセッション。束1)", origin_memo: "青森は「青い森」から。本世界ではその森を碧の林と呼ぶ", notes: "ルビ推奨(音読みでやや硬い)。記録:逆鱗(げきりん)と1音違い。青い森鉄道は路線名として別に替える", review: "NG受け入れ可", record: "docs/proposals/2026-10-03_pref_batch1_tohoku.md、docs/reviews/2026-10-03_review_pref_batch1_tohoku_NG.md"}
    - {real: "岩手県", fictional: "誓岩県", yomi: "せいがんけん", parent: "陸奥(地方)", rule: "G-07(岩手の名の由来の伝説)", verdict: "採用", ruling: "Gin「ここまでのものを採択、次に行きます」(2026-10-03、HNS-NGのセッション。束1)", origin_memo: "三ツ石の神(大岩)に懲らしめられた鬼が、二度とこの地を荒らさないという確約を岩の上に手形で残した伝説(Wikipedia「岩手県」本文)から、誓いの岩の県", notes: "記録:西岸・誓願(仏教の語、誓願寺)と同音。読み上げで確かめる。由来の本文の語は「確約」", review: "NG条件付き", record: "docs/proposals/2026-10-03_pref_batch1_tohoku.md、docs/reviews/2026-10-03_review_pref_batch1_tohoku_NG.md"}
    - {real: "宮城県", fictional: "杜砦県", yomi: "とさいけん", parent: "陸奥(地方)", rule: "DIFF-016(宮→杜、城→砦)", verdict: "採用", ruling: "Gin「見杜　砦　（」「宮⇔杜　城⇔砦」「tosai」「ここまでのものを採択、次に行きます」(2026-10-03、HNS-NGのセッション。E5の杜城県〈もりぎ〉に替わる)", origin_memo: "仙台の雅称「杜の都」の杜と、城を砦に", notes: "字のとおり音読みで読める。記録:とさ＝土佐を思わせうる(方面は遠い)、都債と同音(低頻度)。訓のとりでではないので取手市は避けられている", review: "NG受け入れ可(住所検索・OpenPOI・Wikipedia完全一致0件)", record: "docs/proposals/2026-10-03_pref_batch1_tohoku.md、docs/reviews/2026-10-03_review_pref_batch1_tohoku_NG.md"}
    - {real: "秋田県", fictional: "杉穂県", yomi: "すぎほけん", parent: "陸奥(地方)", rule: "G-07(県の木・秋田杉と、米どころの稲穂)", verdict: "採用", ruling: "Gin「ここまでのものを採択、次に行きます」(2026-10-03、HNS-NGのセッション。束1)", origin_memo: "秋田杉の山と稲穂の田(県の木は秋田杉、Wikipedia「秋田県」)", notes: "記録:穂は嶺姿県の穂澪市(米沢)と同じ字(同じ字の重なりは許す範囲)", review: "NG受け入れ可", record: "docs/proposals/2026-10-03_pref_batch1_tohoku.md、docs/reviews/2026-10-03_review_pref_batch1_tohoku_NG.md"}
