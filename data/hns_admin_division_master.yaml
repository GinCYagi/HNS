  regional:
    - {real: "会津", fictional: "相津", yomi: "あいづ", rule: "G-01(古事記の表記)", verdict: "採用", ruling: "Gin「b」(相津を置く)", origin_memo: "四道将軍の大毘古命と建沼河別命の親子がこの地で合流した", record: "docs/proposals/2026-10-01_ryuto_stations_lines.md §9.4", reading_overlap: "読みは あいづ のまま(英字は Aitsu、DIFF-038)。よろずよ(柳都大橋)に次ぐ、現実との二つ目の重なりとしてわざと残す。あいつ(彼奴と同じ音)・あいず(合図と同じ音、声は づ＝ず で変わらない)の賛否を比べたうえで。Gin「Aidu、だとアイドゥに聞こえそうだからねぇ」「それともあえて「あいず」読みにずらす？」「そこだけよろずよに次ぐ「重なり」にならざるを得ないか、和紙を通してのつながりが強すぎるのかもしれない」「oエガイします」(2026-10-09)。HNS-M4の読み取り:和紙＝ワシ(作中の Gin、Gin 本人)を通してのつながり"}
  shichido:
    - {real: "東海道", fictional: "松並道", yomi: "まつなみのみち", rule: "G-07(典拠:街道の松並木。御油の松並木〈東海道の御油宿と赤坂宿の間〉、Wikipedia「御油の松並木」)", verdict: "採用", ruling: "Gin「東海道 候補」→日出路にGin「日出ずる国のメインストリート、という意味ではありかもしれないけど、西の人はイラッとしそう」→「三保の松原は兵庫だったよね」(HNS-Rev:静岡〈駿河〉、東海道の中)→「でも松並道ありだね、それなら」(2026-10-03)", origin_memo: "街道の松並木の続く道。駿河の三保の松原(日本三大松原、富士山の世界文化遺産の構成資産)もこの道の中。南の海渡道と並べて白砂青松", notes: "7モーラ上限ちょうど。記録:松並は実在の地名31件・施設7件・名字、松波・松浪と同音(NG)。松並木は全国の街道にある姿で、東が上に聞こえない。海つ道は海渡道と「海〜つみち」が重なるのでやめた", review: "NG条件付き(2026-10-03、docs/reviews/2026-10-03_review_tokaido_NG.md §7〜§8)", record: "docs/proposals/2026-10-03_tokaido_candidates.md"}
    - {real: "南海道", fictional: "海渡道", yomi: "うみとみち", rule: "G-07(典拠:紀伊の加太港から海路で淡路の由良港へ、福良港から再び海路で四国の撫養港へ。七道で海を渡ってつなぐ道、Wikipedia「南海道」)", exception: "決まりどおり(DIFF-058 の足し：序数の 第〇・〇番 は替えない／海そのものを呼ぶ名の 海 は残す)", verdict: "採用", ruling: "Gin「ほだらみち 再考」「西方浄土論がなんとか」→「推しで行きます」→NGの記録(わたつみ＝きけ わだつみのこえ)を聞いて「なるほどね、特攻の話だっけ」「うみとみち では？」(2026-10-03)", origin_memo: "海を二度渡ってつなぐ道。淡路の慶野松原(国の名勝)もこの道の中", notes: "ルビ必須(渡＝と は音読み、かいと・うみわたりと読まれる)。読みを「わたつみち」から「うみとみち」にしてわだつみの連想を外した。記録:海渡は実在の地名(海渡町〈広島〉ほか)・店名、人名かいと。「海と道」と聞こえるので初出は名前と分かる言い方で。補陀落道は方位浄土案の支えがなくなり、死の連想もあってやめた", review: "NG条件付き(2026-10-03、docs/reviews/2026-10-03_review_nankaido_NG.md §5)", record: "docs/proposals/2026-10-03_nankaido_candidates.md"}
    - {real: "山陽道", fictional: "光面道", yomi: "かげとものみち", rule: "G-01(山陽道の古い呼び名そのもの。影面道・光面道〈かげとものみち〉、Wikipedia「山陽道」)・DIFF-021(今は使われていない古称)", verdict: "採用", ruling: "Gin「きらのみち 検討」「極楽道できらのみちです」→NGの条件(死後の浄土・広島)を聞いて「だとあれだね」「再考」→「きらに拘らず候補を出してもらえる？地理的な歴史とか由来を考えて」→「かげとものみち、で行きましょう」「読みが違えばピカ連想も違うはずです」(2026-10-03)", origin_memo: "山の光の当たる面の道。古代、都と大宰府を結ぶ七道でただ一つの大路。山陰道(神在道、もとは神府道)の古名は背面道(そとものみち)で、光と背の対", notes: "C-07:ルビ必須(こうめんどうと読まれる)。7モーラで上限ちょうど。光の字と広島の連想は、読み「かげとも」で離れる(Gin)。神在道(もとは神府道)とのセット条件を満たす(山陰=神、山陽=光の面)", review: "NG条件付き→Gin裁定(DIFF-021の線で通る)", record: "docs/proposals/2026-10-03_sanyodo_candidates.md、docs/proposals/2026-10-03_gokurakudo_kira.md"}
    - {real: "東山道", fictional: "嶺路", yomi: "みねじ", rule: "一字＋路(DIFF-020、雪路と同じ型)", verdict: "採用", ruling: "Gin「今も人が居て使われる単語は除外したい」、NGの問い「東山道を『嶺路（みねじ）』にするか（権現道はやめる）」にGin「一文字と道パターンありですね」「嶺路、いいですね」(2026-10-03、HNS-NGのセッション)", origin_memo: "山々の嶺をたどる道。東山道は近江・美濃・飛騨・信濃・上野・下野・陸奥・出羽の山国を通る", notes: "C-07:ルビ必須(れいじ＝零時・例示と読まれる)。層:嶺路は七道、陸奥(みちのく)は東北の地方名で嶺路の中にある。七道の名は字数に縛らない(DIFF-020):一字の雪路・嶺路、二字の火守道・神在道(もとは神府道)、三字の松並道・海渡道・光面道", review: "NG受け入れ可(2026-10-03、条件:ルビ必須)"}
    - {real: "北陸道", fictional: "雪路", yomi: "ゆきじ", rule: "G-07(典拠:雪国の雁木)", verdict: "採用", ruling: "Gin「字数と同じだし雁木良い気がします」「でも否寄なんだ」「再考」「推奨で行きましょう」(2026-10-03、HNS-E5のセッション。推奨どおり3つを決めたと読んだ。違えばGinが直す)", notes: "越路はやめる(柳都県の中に越路〇〇が11件いまも生きている、旧越路町は2006年に長岡市へ。NG再査読)。記録:一般語(雪の道)、女性の名前に見える(害なし)。雪は陸奥・北加伊にも強いので典拠(雁木)で支える", review: "NG受け入れ可の見込み(2026-10-03)", record: "docs/proposals/2026-10-03_hokurikudo_joetsu_candidates.md §4・§5"}
