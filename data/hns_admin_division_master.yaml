  - {real: "横浜市", fictional: "おうはま市", yomi: "おうはまし", parent: "仏名瀬県", rule: "RUL-022の一部(ひらがなの市名)だけを借りる。県と同じ音にはしない(RUL-022を広げたのではない)・横の音読み「おう」", verdict: "採用", ruling: "Gin「鴎濱県（おうはまけん）おうはま市」→「これは県市丁異名から同名への移行だか妥当性をら検討」→HNS-Orcの問いにGin「仏名瀬県おうはま市」(2026-10-04)", origin_memo: "横浜の横を音で読んで「おうはま」。港町の名前をひらがなで", notes: "県(仏名瀬県)とは別の名前のまま(現実の神奈川県/横浜市と同じ形)。記録:大浜(おおはま、各地の小さな地名)と近い音。OpenPOI「マリーナパーク王浜」(場所・読み未確認)。漢字で書くと鴎濱(Gin「漢字で書いたら鴎濱（横浜の浜の旧字体）というつながりになる」2026-10-04。濱は横濱の字、鴎は県の鳥。Gin「市の鳥だし」→カモメは横浜のシンボルとしてよく使われるが、市の鳥としての正式な制定はない〈市の花はバラ〉、県の鳥としては正式(Wikipedia「ダ・カーポ (歌手グループ)」脚注・「神奈川県のシンボル一覧」、出典は横浜市公式サイト・神奈川県のシンボル。HNS-Orc 2026-10-04)。りゅうと市と柳都の関係と同じ、ひらがなの市名の裏にある字)。県名には採らなかった。京浜は使わない方針のまま", review: "NG受け入れ可(鴎濱県・おうはま市として)", record: "docs/proposals/2026-10-04_pref_batch2_kanto.md(§9.4・§11、NGの査読は束2の文書に追記)"}
