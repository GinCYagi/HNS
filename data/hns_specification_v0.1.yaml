# =============================================================
# HNS — Hinomoto Naming Specification / 日ノ本命名仕様書
# 仕様書本体データ
# =============================================================
document:
  name: "HNS仕様書データ"
  hns_version: "0.1"
  status: "凍結(2026-07時点)。変更はVer.0.2差分として管理"
  project_tag: "【HNS】"
  exported_by: "Fable"
  exported_at: "2026-07-12"
  full_name:
    en: "Hinomoto Naming Specification"
    ja: "日ノ本命名仕様書"
    adoption_note: "英日の意味一致・仕様書命名慣行(HTML/CSS/RFC)との親和性を理由に正式固定"

roles:
  Gin: "世界観・歴史・最終裁定"
  チャッピー: "命名規則の抽出・一般化・アルゴリズム化・依存関係設計・矛盾検出"
  Fable: "査読・史実整合・音韻衝突・大量運用時の破綻検出"

design_principles:
  - id: P-01
    name: "派生元エントリによる依存木管理"
    note: "親が変われば子孫が自動的に見直し対象になる構造をマスター表に持たせる"
  - id: P-02
    name: "親未確定時の管線停止(親待ち)"
    note: "京浜系3往復停滞の再発防止機構としてD系停止条件を正式仕様化"
  - id: P-03
    name: "棄却理由の必記録"
    note: "却下候補の再提案防止と規則改善時の追跡のため査読辞書へ必ず記録"
  - id: P-04
    name: "監査証跡(Audit Trail)"
    note: "由来メモ・査読辞書への引用は冠記・発信者・宛先を含む原文形式で転記"
  - id: P-05
    name: "制約が世界観を形成する"
    status: "文言案提示済み・Gin裁定待ち"
    draft_text: >-
      C系査読による棄却・制約は、単なる名称の排除ではなく世界設定の生成契機として
      扱うことができる。制約から生じた運用実態(例:神府道が常に正式名称で呼称される)は、
      由来メモを通じて世界史へ還元する。
  - id: P-06
    name: "方針転換は早いほど安い"
    note: "西海道→火守道連鎖修正のパイロット教訓"

# -------------------------------------------------------------
# G系(Generative:候補生成規則)
# -------------------------------------------------------------
rules_generative:
  - id: G-01
    name: "古称・雅称採用"
    examples_adopted: ["東北→陸奥", "名古屋→蓬左"]
    note: "最優先で適用"
  - id: G-02
    name: "律令区分・旧国名採用"
    examples_adopted: ["四国→二名島", "東北→陸奥(重複掲載)"]
    examples_rejected: ["九州→西海道(B案裁定により火守道へ改称・棄却は世界設定変更として整理)"]
    note: "広域名称向き。現行判例は二名島・陸奥のみ。維持方針をGin確認済み"
  - id: G-03
    name: "旧街道名採用"
    examples_adopted: ["中央線→中山道線"]
    note: "重複禁止(例:山陰道→中山道は不可)"
  - id: G-04
    name: "音韻維持置換"
    examples_rejected: ["名古屋→駄賀屋", "大阪→小波"]
    note: "C系査読必須。負性漢字の含意査読を必須化"
  - id: G-05
    name: "地形カテゴリ内置換"
    note: "旧R-04を改称。同カテゴリ内の水平置換のみ(津→湊・浦・浜)。地形反転は禁止"
  - id: G-06
    name: "機能記述命名"
    examples_adopted: ["山手線→東都環状線"]
  - id: G-07
    name_frozen_v0_1: "語源遡行"
    name_template_rev: "典拠再構成"
    examples_adopted: ["丸ノ内→曲輪内(要査読フラグ付)", "西海道→火守道(判例第一号)"]
    activation_condition: >-
      上位規則を置き換える規則ではなく、十分な文化史・歴史・信仰・地誌上の根拠が
      存在するとGinが裁定した場合にのみ選択可能となる規則。
      G-07候補は管線上、Gin裁定を必須通過とする。
    status: "拡張定義(典拠再構成)はVer.0.2差分候補。凍結解除手続き待ち"
  - id: G-07b
    name: "同諺内漢字置換(仮称)"
    examples: ["『和を以て貴しとなす』を典拠に 和⇔貴 を置換"]
    status: "未定義。独立規則化の価値ありとしてVer.0.2差分候補に起票済み"

g_priority_order:
  frozen_v0_1: [G-01, G-02, G-03, G-04以下]
  template_rev: [G-01, G-02, G-03, G-07, G-06, G-05, G-04]
  status: "テンプレート版の順位(G-07を4位へ繰上げ)はVer.0.2差分候補。運用実態と整合するためFableは支持"

# -------------------------------------------------------------
# D系(Derived:導出規則)
# -------------------------------------------------------------
rules_derived:
  stop_condition: "親エントリ未確定の場合は管線を停止し『親待ち』状態で登録する(正式仕様)"
  rules:
    - id: D-01
      name: "合成再生成"
      examples_adopted: ["京葉→都葉(親:東都)"]
    - id: D-02
      name: "会社名導出"
      examples: ["HR+区分名"]
    - id: D-03
      name: "通称導出"
      official_operation: >-
        短縮派生は一律許可・一律禁止とせず、短縮後の名称を新規候補として
        C-01〜C-04(必要に応じてC-08まで)へ再投入する。
      precedents:
        - "HR西海道→HR火守:可(『ひもり』は短縮しても衝突なし)"
        - "神府→HR神府:短縮後に再査読(甲府との近接)。実質短縮禁止・常に『道』を含む形で派生"
      note: "通称の導出規則本文(先頭文字切出し等の機械規則化)は未確定"
    - id: D-04
      name: "施設派生(PA/SA←所在自治体)"
      status: "未運用"

# -------------------------------------------------------------
# C系(Constraint:制約・棄却規則)
# -------------------------------------------------------------
rules_constraint:
  - id: C-01
    name: "実在路線・駅名衝突"
    rejection_examples: ["陸羽新幹線(陸羽東線・西線実在)", "男鹿新幹線(男鹿線実在)", "虎ノ門線(虎ノ門駅実在)", "日ノ本中央新幹線(中央新幹線実在)"]
    open_question: "廃線名(例:日中線)との衝突可否は未確定。現状は一致時に記録し個別判断"
  - id: C-02
    name: "実在自治体・企業名衝突"
  - id: C-03
    name: "同音・近似音衝突"
    rejection_examples: ["白銀線(白銀駅・白金)", "都波(砺波/鳥羽)", "貴川きかわ(紀の川・木川)", "谷背やぜ(八瀬)", "国府こうぶ読み(神府と完全同音・甲武)"]
  - id: C-04
    name: "一般名詞同音"
    rejection_examples: ["小波このは(木の葉)", "日ノ中ひのなか(火の中)", "洲外すげ(菅・『すげー』)"]
  - id: C-05
    name: "差別的・侮蔑的含意(三層判定)"
    title_note: "見出しは『差別的・侮蔑的含意を持ち得る漢字』とする(『被差別漢字』は不使用)"
    layer_1_原則禁止: "穢・賤・虜・奴・非人系、および駄・愚・呆・腐・卑など侮蔑的・劣位的に響く字"
    layer_2_条件付き禁止:
      - "夷・蛮・戎・狄:方角名・集団名との新規造語では不可。歴史的固有名詞は要判断リストで別管理"
      - "犭を含む字:動物・自然地形として読める場合は可。住民・集団・職能を形容する位置は不可"
      - "屠・穢多系:被差別身分・職能への連想が強い字は新規地名に不使用"
    layer_3_要査読: "畜・囚・呪・喪・墓・死など。禁止ではないが採用前に読み・意味・音声上の印象を確認"
    operation:
      - "部首単位の一律禁止は行わない"
      - "旧被差別地名の網羅的リスト化は行わない。完成候補ごとに個別検索"
      - "採用・不採用の判断はマスター表に残す(蝦夷型の『検討済み』記録)"
      - "第2層の判定者を誰にするか(Gin単独か外部の目か)は未確定事項"
  - id: C-06
    name: "格反転禁止"
    definition: "格・規模・序列を反転させる変換を禁止(大阪→小波、本州→末州型)。格を含意しない軸(方角・色等)の反転は可"
    rejection_examples: ["小貴おぎ(最高格の大和への『小』)"]
  - id: C-07
    name: "モーラ・可聴性"
    definition: "通称は7モーラ上限(8以上=否)。正式名称は緩和。難読=条件付き"
  - id: C-08
    name: "世界観整合"
    definition: "格維持・方面整合・既採用名との歴史整合・兄弟エントリ間の読み重複"
rules_constraint_diff_candidates_v0_2:
    - "同字過負荷制約(仮称):同一諺由来の同字を兄弟エントリ内でN回までに制限(広貴/貴川の『貴』事例)"
    - "対エントリ参照列:山陰/山陽型の対名称は片側のみの確定を不可とする"
    - "現代実在地名転用の4条件査読のG系規則としての正式定義"

# -------------------------------------------------------------
# 査読プロトコル Ver.1
# -------------------------------------------------------------
review_protocol:
  execution_order: "1→7の順。否が出た時点で以降省略可。ただし5(含意)のみ常に実施"
  items:
    - no: 1
      name: "実在路線・駅名衝突"
      method: "全国路線名・駅名リストと完全一致照合"
      fail: "現役名と完全一致=否"
    - no: 2
      name: "実在自治体・企業名衝突"
      method: "自治体名簿・主要企業名と照合"
      fail: "完全一致=否、部分一致=記録の上判断"
    - no: 3
      name: "同音・近似音の実在地名"
      method: "読みを仮名化し照合。母音骨格一致も近似とみなす"
      fail: "著名地名と同音=否、近似=条件付き(方面が離れていれば可)"
    - no: 4
      name: "一般名詞との同音"
      method: "読みを国語辞書と照合"
      fail: "高頻度語と同音=否、低頻度語=記録"
    - no: 5
      name: "差別的・侮蔑的含意"
      method: "C-05三層判定"
      fail: "三層の規定に従う"
    - no: 6
      name: "世界観整合"
      method: "格ランク比較・経路と名称の方面照合・由来メモと既採用名の歴史矛盾確認"
      fail: "格降格=否、方面矛盾=Gin裁定へ回付"
    - no: 7
      name: "モーラ・可聴性"
      method: "通称読みのモーラ計上・難読字確認"
      fail: "通称8モーラ以上=否、難読=条件付き"
  automation_note: >-
    1〜4は駅名・自治体リスト突合で半自動化可能。数百件規模では
    「新規候補の読み⇔採用済み読み」の兄弟間照合もC系機械フィルタ(第3段)へ組込むこと。

# -------------------------------------------------------------
# 命名アルゴリズム Ver.0.1(管線)
# -------------------------------------------------------------
pipeline:
  - stage: 1
    name: "G系生成"
    note: "優先順位に従い辞書引き。古称あればG-01最優先。候補5〜20件、各候補に規則ID付与"
  - stage: 2
    name: "D系導出"
    note: "親エントリ指定時はG系スキップし親から機械導出。親未確定なら『親待ち』で停止"
  - stage: 3
    name: "C系機械フィルタ"
    note: "C-01〜C-07を全候補に適用。棄却理由を査読辞書へ必ず記録"
  - stage: 4
    name: "Human Review(Fable)"
    note: "プロトコル5〜7の目視項目と総合判断。推奨・可・条件付きを付す"
  - stage: 5
    name: "Gin裁定"
    note: "世界観・歴史適合で最終決定。裁定理由を由来メモへ。G-07候補は本段必須通過"
  - stage: 6
    name: "Master登録"
    note: "登録と同時に親方向の変更影響カウントを更新"

# -------------------------------------------------------------
# マスター表仕様
# -------------------------------------------------------------
master_table_columns:
  - "エントリID"
  - "実名(現実区分)/実名よみ"
  - "架空名/架空名よみ"
  - "正式名称/正式名称よみ/通称/通称よみ"
  - "カテゴリ(行政区分・都市・路線・道路・会社・PA/SA)"
  - "種別(畿内/七道/地方区分/その他)※行政区分のみ"
  - "適用規則ID"
  - "親エントリ(架空世界内の依存関係専用。現実対応は実名欄が担う)"
  - "対エントリ(差分候補列)"
  - "派生予定カテゴリ"
  - "衝突チェック結果(C-01〜08の番号で記録)"
  - "格ランク"
  - "変更影響ランク(導出値。派生元エントリ列から推移的に自動集計。手入力禁止)"
  - "由来メモ(命名理由・歴史的位置付け・既採用名称との関係)"
  - "歴史設定メモ"
  - "採否状態(採用・条件付き採用・要修正・保留・親待ち・棄却)"
  - "査読メモ/査読状態(未査読・Fable済・Gin裁定済)"
  - "登録版"

change_impact_rank:
  small: "子孫0〜5件"
  medium: "子孫6〜20件"
  large: "子孫21件以上"
  rules:
    - "手入力ではなく派生元エントリ列からの自動集計(導出項目)"
    - "直接派生数ではなく子孫総数(推移的カウント)で判定"
  first_application: "西海道→火守道連鎖修正(2026-07-07裁定)"

dictionary_schemas:
  common_columns: ["エントリID", "査読状態(未査読・Fable済・Gin裁定済)", "登録版", "出典・由来メモ"]
  古称辞書: ["現代名", "現代よみ", "古称", "古称よみ", "種別(旧称・雅称・歴史名)", "使用時代", "格ランク"]
  旧国名辞書: ["旧国名", "よみ", "対応現代都道府県(複数可)", "所属律令区分", "本世界での採用状態(採用・改名・未使用)"]
  カテゴリ置換辞書: ["字", "よみ", "カテゴリ(水系・山系・平野・海岸)", "置換可能字リスト", "使用可能文脈(主要部・接尾・路線名のみ)"]
  音韻辞書: ["元字", "候補字", "モーラ・母音構造", "含意フラグ(C-05三層)", "使用可能文脈", "使用回数カウント(同字過負荷検査用・差分候補)"]
  査読辞書: ["対象名", "よみ", "検査項目(C-01〜08)", "結果(合・否・条件付き)", "根拠(衝突相手の実在名等)", "判定日", "判定者"]
  典拠タイプ分類: ["語源", "故事成語", "信仰・祭祀", "地誌"]  # G-07由来メモの品質管理用(条件付き提案)

# -------------------------------------------------------------
# 運用規約
# -------------------------------------------------------------
operational_rules:
  message_format: "【プロジェクト名/略称】発信者より宛先への文(15〜30字要約・役割語必須)"
  role_words: ["依頼", "報告", "裁定", "検収", "差し戻し"]
  unknown_project: "【要確認】を使い勝手に補完しない"
  forwarding: "元タグを消さず、必要なら文責行を積む"
  audit_trail: "由来メモ・査読辞書への引用は冠記付き原文形式で転記(監査証跡)"
  freeze_discipline: "凍結中は規則修正提案をせずVer.0.2差分候補として記録に留め、査読は凍結版規定通りに実施"

version_management:
  current: "Ver.0.1凍結"
  policy: "規則ID・定義・種別・制定日を凍結。変更はVer.0.2差分として記録。各地名に生成時の規則版を紐付け"
  v0_2_first_entry: "西海道→火守道(世界設定変更として整理)"
