header:
  canonical: "【HNS】Task｜HNS-Crd-local より HNS-Imp-local・HNS-Rev-local への文（READMEローカル検証案内）"
  project:
    identifier: HNS
    prefix: HNS-
  type: Task

objective: >
  HNSリポジトリの利用者が、既存のローカルテスト一式を実行する方法を
  ルートREADMEから確認できるようにする。

selection:
  reason: >
    ルートREADMEには設計文書への導線はあるが、package.jsonに既存のtest scriptが
    定義されているにもかかわらず実行案内がない。README.mdへの短い追記だけで完了し、
    正典・Decision・受入テストの変更を伴わず、既存テストで検証できるため選定した。
  criteria:
    canon_change_requested: false
    decision_required: false
    acceptance_test_change_requested: false
    scope_small: true
    tests_available: true

scope:
  included:
    - ルートREADME.mdへのローカル検証セクション追加
    - npm test実行例の記載
    - 実行される既存テスト領域の簡潔な説明
  excluded:
    - README.md以外の変更
    - テストの追加または変更
    - package.jsonの変更
    - 正典変更
    - Decision発行
    - Git push
    - merge

constraints:
  - README.md以外を変更しない
  - 既存記述を維持する
  - 日本語で簡潔に記載する
  - 実際のpackage.jsonのtest scriptと矛盾させない

acceptance:
  - README.mdにローカル検証セクションが存在する
  - npm testの実行例がコードブロックで記載される
  - manifest検証、Canonical Loader、Role Runnerのテストが実行対象であることを説明する
  - npm testが成功する

execution:
  test_command: ["npm", "test"]
