summary: >-
  npm testはManifest、Canonical Loader、Role Runnerを含めて成功し、main由来の
  Loader・Manifest実装も同一である。一方、統合差分にはRole Runnerと無関係な
  Header Standard正典コピーの変更が混入している。また、正典変更・受入テスト変更の
  停止判定がRuntimeの自己申告だけに依存し、実ファイル差分を検証しない。
  一時成果物の追跡とローカル絶対パスの収録、異常終了コードの文書不整合もあるため、
  承認せずGinへエスカレーションする。

