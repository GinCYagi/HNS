---
role: HNS-Rev-local
round: 2
kind: review
prompt: |
  You are HNS-Rev-local. Review the implementation against the supplied YAML Task.
  Do not edit files. Classify severity conservatively.
  Round: 2
  Task:
  ---
  header:
    canonical: "【HNS】Task｜HNS-Crd-local より HNS-Imp-local・HNS-Rev-local への文（READMEローカル検証案内）"
    project:
      identifier: HNS
      prefix: HNS-
    type: Task
  objective: 'HNSリポジトリの利用者が、既存のローカルテスト一式を実行する方法を ルートREADMEから確認できるようにする。

  '
  selection:
    reason: 'ルートREADMEには設計文書への導線はあるが、package.jsonに既存のtest scriptが 定義されているにもかかわらず実行案内がない。README.mdへの短い追記だけで完了し、
      正典・Decision・受入テストの変更を伴わず、既存テストで検証できるため選定した。

  '
    criteria:
      canon_change_requested: false
      decision_required: false
      acceptance_test_change_requested: false
      scope_small: true
      tests_available: true
  scope:
    included:
    - ルートREADME.mdへのローカル検証セクション追加
    - npm test実行例の記載
    - 実行される既存テスト領域の簡潔な説明
    excluded:
    - README.md以外の変更
    - テストの追加または変更
    - package.jsonの変更
    - 正典変更
    - Decision発行
    - Git push
    - merge
  constraints:
  - README.md以外を変更しない
  - 既存記述を維持する
  - 日本語で簡潔に記載する
  - 実際のpackage.jsonのtest scriptと矛盾させない
  acceptance:
  - README.mdにローカル検証セクションが存在する
  - npm testの実行例がコードブロックで記載される
  - manifest検証、Canonical Loader、Role Runnerのテストが実行対象であることを説明する
  - npm testが成功する
  execution:
    test_command:
    - npm
    - test

  Implementation receipt:
  ---
  status: changed
  summary: README.mdにローカル検証セクションが追加されており、npm testの実行例と対象領域を確認した。npm testは全テスト成功（終了コード0）。
  changed_files:
  - README.md
  canon_change_requested: false
  decision_required: false
  acceptance_test_change_requested: false

  Test result:
  ---
  command:
  - npm
  - test
  passed: true
  exit_code: 0

  Return exactly one YAML mapping with these keys:
  review_severity: note|minor|moderate|major|blocker
  summary: string
  findings: [{id: string, severity: string, message: string, file: string|null}]
  scope_unchanged: boolean
  canon_change_requested: boolean
  decision_required: boolean
  acceptance_test_change_requested: boolean
  conflicting_recommendations: boolean
